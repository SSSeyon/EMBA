<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>EMBA 2027 — Admissions Tracker</title>
<link rel="manifest" href="manifest.json" />
<meta name="theme-color" content="#0f1117" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="EMBA 2027" />
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png" />
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png" />
<link rel="apple-touch-icon" href="apple-touch-icon.png" />
<script>
/* Runs before any paint so a light-mode user never sees a dark flash.
   Deliberately tiny and dependency-free — it must not wait for anything. */
(function () {
  try {
    var saved = localStorage.getItem('emba-theme');
    var mode = saved || (window.matchMedia &&
      window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark');
    document.documentElement.setAttribute('data-theme', mode);
  } catch (e) {
    document.documentElement.setAttribute('data-theme', 'dark');
  }
})();
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* ---------- Theme ----------
   Dark is the default. Light is applied by setting data-theme="light" on
   <html>. Every colour in the app comes from these variables — if you add a
   rule with a literal hex in it, it will break one of the two themes. */
/* The palette is SpendWise's "Classic" scheme, lifted token-for-token from
   that app: deep blue-navy dark, cool blue-grey light, teal accent. */
:root, :root[data-theme="dark"]{
  --ink:#0f1117;        /* page background        */
  --ink-2:#161b25;      /* cards, raised surfaces */
  --ink-3:#1c2333;      /* inputs, hover, chips   */
  --line:#252d3d;       /* borders, rules         */
  --paper:#e8edf5;      /* primary text           */
  --muted:#7d8fa8;      /* secondary text         */
  --accent:#14b8a6;     /* accent: brand, active  */
  --accent-lo:rgba(20,184,166,.10);
  --red:#f87171;        /* overdue / urgent       */
  --red-lo:rgba(248,113,113,.12);
  --amber:#fbbf24;      /* due soon               */
  --amber-lo:rgba(251,191,36,.10);
  --green:#4ade80;      /* done / confirmed       */
  --green-lo:rgba(74,222,128,.10);
  --blue:#60a5fa;       /* links                  */
  --blue-lo:rgba(96,165,250,.12);
  --header-bg:rgba(15,17,23,.92);
  --on-accent:#0f1117;  /* text on a filled accent */
  --urgent:rgba(248,113,113,.38); /* urgent card border */
  --banner-ink:#ecdba6;
  --shadow:rgba(0,0,0,.5);
  /* Two-layer shadow: a tight contact line plus a soft wide bloom. Cards
     float on it instead of relying on borders alone. */
  --lift:0 1px 3px rgba(0,0,0,.4),0 4px 16px rgba(0,0,0,.25);
  --r:10px;
}
:root[data-theme="light"]{
  --ink:#f0f4f8;
  --ink-2:#ffffff;
  --ink-3:#edf0f5;
  --line:#dde3ec;
  --paper:#1a2232;
  --muted:#5a6a80;
  --accent:#0d9488;
  --accent-lo:rgba(13,148,136,.10);
  --red:#ef4444;
  --red-lo:rgba(239,68,68,.10);
  --amber:#d97706;
  --amber-lo:rgba(217,119,6,.10);
  --green:#16a34a;
  --green-lo:rgba(22,163,74,.10);
  --blue:#3b82f6;
  --blue-lo:rgba(59,130,246,.10);
  --header-bg:rgba(240,244,248,.92);
  --on-accent:#ffffff;
  --urgent:rgba(239,68,68,.38);
  --banner-ink:#7a5208;
  --shadow:rgba(0,0,0,.14);
  --lift:0 1px 3px rgba(0,0,0,.08),0 4px 16px rgba(0,0,0,.06);
}
*{box-sizing:border-box;margin:0;padding:0}
html{color-scheme:dark}
html[data-theme="light"]{color-scheme:light}
html,body{background:var(--ink);color:var(--paper);}
body{
  /* Serif for running text is the SpendWise signature — almost no app does
     it, and it is most of why that app feels the way it does. Palatino is a
     system font on every platform, so there is nothing extra to download. */
  font-family:'Book Antiqua','Palatino Linotype',Palatino,Georgia,serif;
  font-size:15px;line-height:1.5;
  -webkit-font-smoothing:antialiased;
  padding-bottom:env(safe-area-inset-bottom);
}
.mono{font-family:'IBM Plex Mono',ui-monospace,monospace;font-variant-numeric:tabular-nums;}
.display{font-family:'Fraunces',Georgia,serif;}
button{font:inherit;color:inherit;background:none;border:none;cursor:pointer}
a{color:var(--blue)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:4px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* ---------- Shell ---------- */
header{
  position:sticky;top:0;z-index:20;background:var(--header-bg);
  backdrop-filter:blur(10px);border-bottom:1px solid var(--line);
  padding-top:env(safe-area-inset-top);
}
.hwrap{max-width:1240px;margin:0 auto;padding:14px 20px;display:flex;align-items:center;gap:16px}
.brand{font-family:'Fraunces',serif;font-size:19px;font-weight:600;letter-spacing:-.01em;white-space:nowrap}
.brand span{color:var(--accent)}
.ver{font-family:'IBM Plex Mono',monospace;font-size:10px;color:var(--muted);letter-spacing:.02em;padding:2px 6px;border:1px solid var(--line);border-radius:6px;white-space:nowrap;opacity:.7}
.ver:hover{opacity:1;color:var(--accent)}
.sync{font-family:'IBM Plex Mono',monospace;font-size:10.5px;color:var(--muted);display:flex;align-items:center;gap:6px;white-space:nowrap}
.dot{width:7px;height:7px;border-radius:50%;background:var(--green)}
.dot.off{background:var(--muted)}
.spacer{flex:1}
.ghost{font-size:13px;color:var(--muted);padding:7px 12px;border:1px solid var(--line);border-radius:8px}
.ghost:hover{color:var(--paper);border-color:var(--muted)}

/* Icon button — the header theme toggle. 40px square keeps it a comfortable
   thumb target on a phone. */
.iconbtn{
  width:40px;height:40px;flex-shrink:0;display:grid;place-items:center;
  font-size:16px;line-height:1;border:1px solid var(--line);
  border-radius:10px;color:var(--muted);
}
.iconbtn:hover{color:var(--accent);border-color:var(--muted)}
.iconbtn:active{background:var(--ink-3)}

/* Toggle switch — used in Settings for the same theme control. */
.switch{
  position:relative;width:52px;height:30px;flex-shrink:0;border-radius:15px;
  background:var(--ink-3);border:1px solid var(--line);transition:background .18s ease;
}
.switch::after{
  content:'';position:absolute;top:3px;left:3px;width:22px;height:22px;
  border-radius:50%;background:var(--muted);transition:transform .18s ease,background .18s ease;
}
/* Invisible padding so the thumb target clears 44px without making the
   switch itself look oversized. */
/* Invisible tap area. The switch is 30px tall for looks; this pushes the
   touch target past 44px without changing what you see. Rows are 73px
   apart, so neighbouring switches never overlap. */
.switch::before{content:'';position:absolute;inset:-9px -6px}
.switch.on{background:var(--accent);border-color:var(--accent)}
.switch.on::after{transform:translateX(22px);background:var(--on-accent)}

/* ---------- Bottom tab bar ----------
   Thumb-reachable navigation, which is the whole reason it is down here
   rather than under the header: on a tall phone the top of the screen is
   the hardest place to reach. A floating pill detached from the screen
   edge at every width — SpendWise-style — rather than an edge-to-edge
   bar; it grows a little wider on desktop but keeps the same shape. */
nav{
  position:fixed;left:50%;transform:translateX(-50%);z-index:30;
  bottom:calc(12px + env(safe-area-inset-bottom));
  width:min(560px,calc(100% - 24px));
  display:flex;gap:1px;
  padding:5px 6px;
  background:var(--ink-2);border:1px solid var(--line);border-radius:36px;
  box-shadow:var(--lift);
}
.tab{
  flex:1;min-width:0;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;
  padding:7px 2px;border-radius:28px;
  font-size:8.5px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;
  color:var(--muted);
  /* The overshoot easing gives the active pill a little spring. */
  transition:color .18s cubic-bezier(.34,1.56,.64,1),background .18s cubic-bezier(.34,1.56,.64,1);
}
.tab svg{
  width:21px;height:21px;flex-shrink:0;
  fill:none;stroke:currentColor;stroke-width:1.7;
  stroke-linecap:round;stroke-linejoin:round;
}
.tab span{overflow:hidden;text-overflow:ellipsis;max-width:100%;white-space:nowrap}
.tab.on{color:var(--accent);background:var(--accent-lo)}
.tab:active{opacity:.65}
@media(min-width:641px){
  .tab{font-size:9.5px}
  .tab:hover{color:var(--paper)}
}

/* Clear the bar so the last row of content is never trapped under it. */
/* --pad is the page gutter. Anything that deliberately bleeds past it (the
   runway strip) reads it back rather than hard-coding 20px, which would
   overflow the page at the narrower phone gutter below. */
main{--pad:20px;max-width:1240px;margin:0 auto;padding:24px var(--pad) calc(104px + env(safe-area-inset-bottom))}
.panel{display:none}
.panel.on{display:block}

/* ---------- Countdown hero ---------- */
.hero{
  border:1px solid var(--line);border-radius:14px;overflow:hidden;margin-bottom:24px;
  background:linear-gradient(180deg,var(--ink-2),var(--ink));
  box-shadow:var(--lift);
}
.hero-top{padding:20px 22px;display:flex;flex-wrap:wrap;gap:20px;align-items:flex-end}
.eyebrow{font-size:11px;text-transform:uppercase;letter-spacing:.11em;color:var(--muted)}
.days{font-family:'Fraunces',serif;font-size:56px;font-weight:700;line-height:.95;letter-spacing:-.03em}
.days.crit{color:var(--red)}
.days.warn{color:var(--amber)}
.days-label{font-size:13px;color:var(--muted);margin-top:6px}
.hero-school{margin-left:auto;text-align:right}
.hero-school .n{font-size:15px;font-weight:600;display:flex;align-items:center;gap:8px;justify-content:flex-end}
.hero-school .d{font-size:12px;color:var(--muted);margin-top:3px}
.hero-bar{display:flex;border-top:1px solid var(--line)}
.stat{flex:1;padding:13px 16px;border-right:1px solid var(--line);min-width:0;position:relative;overflow:hidden}
.stat:last-child{border-right:none}
/* Each box is its own progress bar: the tint fills left-to-right in
   proportion to the number shown, so the dashboard reads at a glance
   without anyone having to parse four separate figures. */
.statfill{
  position:absolute;left:0;top:0;bottom:0;width:0;
  background:var(--accent-lo);transition:width .45s cubic-bezier(.4,0,.2,1);
}
.statfill.green{background:var(--green-lo)}
.statfill.red{background:var(--red-lo)}
.stat .k,.stat .v{position:relative;z-index:1}
.stat .k{font-size:10px;text-transform:uppercase;letter-spacing:.09em;color:var(--muted)}
.stat .v{font-family:'IBM Plex Mono',monospace;font-size:19px;font-weight:600;margin-top:3px;font-variant-numeric:tabular-nums}

/* ---------- Progress ---------- */
.pwrap{height:5px;background:var(--ink-3);border-radius:3px;overflow:hidden}
.pbar{height:100%;background:var(--accent);border-radius:3px;transition:width .3s ease}
.pbar.done{background:var(--green)}

/* ---------- Section ---------- */
.sechead{display:flex;align-items:baseline;gap:12px;margin:28px 0 12px}
.sechead h2{font-family:'Fraunces',serif;font-size:21px;font-weight:600;letter-spacing:-.01em}
.sechead .c{font-family:'IBM Plex Mono',monospace;font-size:11px;color:var(--muted)}
.sechead:first-child{margin-top:0}

/* ---------- Cards ---------- */
.grid{display:grid;gap:12px}
.card{
  border:1px solid var(--line);border-radius:12px;background:var(--ink-2);overflow:hidden;
  box-shadow:var(--lift);
}
.card.urgent{border-color:var(--urgent)}
.chead{padding:14px 16px;display:flex;align-items:flex-start;gap:12px;cursor:pointer;user-select:none}
.chead:hover{background:var(--ink-3)}
.cname{font-weight:600;font-size:15px;letter-spacing:-.01em}

/* School logo — sits in front of the name. Any square-ish image works;
   see the "School logos" block in the JS below for where they come from. */
.logo{
  width:30px;height:30px;border-radius:7px;flex-shrink:0;display:block;
  object-fit:contain;background:var(--ink-3);
}
.cmeta{font-size:12px;color:var(--muted);margin-top:4px;display:flex;flex-wrap:wrap;gap:5px 10px}
.cright{margin-left:auto;text-align:right;flex-shrink:0}
.cdays{font-family:'IBM Plex Mono',monospace;font-size:17px;font-weight:600;font-variant-numeric:tabular-nums}
.cdays.crit{color:var(--red)}
.cdays.warn{color:var(--amber)}
.cdays.ok{color:var(--muted)}
.cprog{font-size:11px;color:var(--muted);margin-top:3px}
.caret{color:var(--muted);font-size:11px;transition:transform .2s;flex-shrink:0;margin-top:4px}
.card.open .caret{transform:rotate(90deg)}
.cbody{display:none;border-top:1px solid var(--line);padding:6px 16px 14px}
.card.open .cbody{display:block}
.cinfo{font-size:12px;color:var(--muted);padding:10px 0;line-height:1.65;border-bottom:1px solid var(--line);margin-bottom:6px}
.cinfo b{color:var(--paper);font-weight:500}

/* ---------- Pills ---------- */
.pill{
  display:inline-block;font-size:10px;font-weight:600;text-transform:uppercase;
  letter-spacing:.07em;padding:2px 7px;border-radius:4px;white-space:nowrap;
}
.p-URGENT{background:var(--red-lo);color:var(--red)}
.p-HIGH{background:var(--amber-lo);color:var(--amber)}
.p-AMBER{background:var(--amber-lo);color:var(--amber)}
.p-STANDARD{background:var(--ink-3);color:var(--muted)}
/* Application pipeline. Neutral until it is with the school, then it
   warms up through interview and offer; rejected reads as closed, not
   alarming — it is information, and the runway stops nagging either way. */
.ap-drafting{background:var(--ink-3);color:var(--muted)}
.ap-submitted{background:var(--blue-lo);color:var(--blue)}
.ap-interview{background:var(--amber-lo);color:var(--amber)}
.ap-offer{background:var(--green-lo);color:var(--green)}
.ap-accepted{background:var(--green-lo);color:var(--green)}
.ap-rejected{background:var(--ink-3);color:var(--muted);text-decoration:line-through}
.qsp{background:var(--blue-lo);color:var(--blue)}
.w-Green{background:var(--green-lo);color:var(--green)}
.w-Amber{background:var(--amber-lo);color:var(--amber)}
.w-Red{background:var(--red-lo);color:var(--red)}
/* Flags and the estimates banner are warnings, so they stay amber — the
   teal accent is for brand and active states, not caution. */
.flag{background:var(--amber-lo);color:var(--amber);font-size:11px;padding:6px 9px;border-radius:6px;margin:8px 0;display:block;line-height:1.5}
.est{color:var(--muted);font-weight:400}
.est::before{content:'~';margin-right:1px;opacity:.7}
.banner{
  border:1px solid var(--amber);background:var(--amber-lo);border-radius:10px;
  padding:12px 14px;margin-bottom:18px;font-size:12.5px;line-height:1.6;color:var(--banner-ink);
}
.banner b{color:var(--amber)}

/* ---------- Tasks ---------- */
.task{display:flex;align-items:flex-start;gap:11px;padding:8px 0;font-size:14px}
.task+.task{border-top:1px solid var(--line)}
.cb{
  width:18px;height:18px;border:1.5px solid var(--muted);border-radius:5px;
  flex-shrink:0;margin-top:1px;display:grid;place-items:center;
  transition:all .15s;background:transparent;
}
.cb:hover{border-color:var(--accent)}
.cb.on{background:var(--green);border-color:var(--green)}
.cb.on::after{content:'✓';color:var(--on-accent);font-size:12px;font-weight:700;line-height:1}
.tlabel{flex:1;min-width:0;line-height:1.45}
.task.done .tlabel{color:var(--muted);text-decoration:line-through}
.tdue{
  font-family:'IBM Plex Mono',monospace;font-size:11px;color:var(--muted);
  flex-shrink:0;margin-top:2px;font-variant-numeric:tabular-nums;
}
.tdue.crit{color:var(--red)}
.tdue.warn{color:var(--amber)}
.task.done .tdue{color:var(--muted);opacity:.5}
.tdel{color:var(--muted);font-size:12px;padding:2px 5px;flex-shrink:0;margin-top:1px;border-radius:4px}
.tdel:hover{color:var(--red);background:var(--red-lo)}
.addtask{font-size:12px;margin-top:8px;padding:6px 10px}

/* ---------- Notes ---------- */
.notes{
  width:100%;margin-top:8px;background:var(--ink-3);border:1px solid var(--line);border-radius:8px;
  color:var(--paper);font:inherit;font-size:13px;padding:9px 11px;min-height:56px;resize:vertical;
}
.notes:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.noteslabel{font-size:10px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);display:block;margin-top:12px}

/* ---------- Deadline edit ---------- */
.dledit{display:flex;flex-wrap:wrap;align-items:center;gap:10px;padding:8px 0}
.dledit input[type=date]{
  background:var(--ink-3);border:1px solid var(--line);border-radius:6px;color:var(--paper);
  font:inherit;font-size:13px;padding:5px 8px;
}
.dledit label{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:5px}
.editlink{font-size:11px;color:var(--blue);margin-left:8px;text-decoration:underline;text-underline-offset:2px}

/* ---------- Table ---------- */
.tscroll{overflow-x:auto;border:1px solid var(--line);border-radius:12px;-webkit-overflow-scrolling:touch;box-shadow:var(--lift)}
table{width:100%;border-collapse:collapse;font-size:13px;min-width:620px}
th{
  background:var(--ink-3);padding:10px 13px;text-align:left;font-size:10px;
  text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:600;white-space:nowrap;
}
td{padding:11px 13px;border-top:1px solid var(--line);vertical-align:top}
tbody tr:hover{background:var(--ink-2)}
td.num{font-family:'IBM Plex Mono',monospace;text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
/* A right-aligned column needs a right-aligned heading, or the header sits
   adrift from the digits it labels. */
th.num{text-align:right}

/* Small logo used in the dashboard runway table and next to the hero school. */
.logo-sm{width:22px;height:22px;border-radius:5px}
.tname{display:flex;align-items:center;gap:9px;min-width:0}

/* ---------- Chips ----------
   SpendWise-style outlined pills, used for the task filter, the this-week
   window and the compare picker. Active = accent tint, like the nav. */
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 12px}
.chip{
  padding:6px 12px;min-height:32px;border-radius:20px;border:1px solid var(--line);
  font-size:11px;font-weight:600;color:var(--muted);background:transparent;
  transition:.13s;
}
.chip.on{border-color:var(--accent);background:var(--accent-lo);color:var(--accent)}
.chip:active{opacity:.7}

/* ---------- School list sort ---------- */
.sortrow{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin:0 0 12px}
.sortrow label{font-size:10px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
.sortsel{
  background:var(--ink-3);border:1px solid var(--line);border-radius:20px;
  color:var(--paper);font:inherit;font-size:12px;font-weight:600;
  padding:6px 12px;min-height:32px;max-width:100%;
}

/* Search box for the task filter. */
.qbox{
  display:flex;align-items:center;gap:8px;border:1px solid var(--line);
  border-radius:10px;background:var(--ink-2);padding:0 12px;margin-bottom:10px;
}
.qbox:focus-within{border-color:var(--accent)}
.qbox input{flex:1;min-width:0;background:none;border:none;color:var(--paper);font:inherit;font-size:14px;padding:11px 0}
.qbox input:focus{outline:none}
.qbox .qx{color:var(--muted);font-size:13px;padding:6px}

/* ---------- Recommenders ---------- */
.recrow{display:flex;align-items:center;gap:10px;padding:9px 0;font-size:13px}
.recrow+.recrow{border-top:1px solid var(--line)}
.recname{flex:1;min-width:0}
.recmeta{font-size:11px;color:var(--muted);margin-top:2px}
/* The status pill is the control: tapping it advances ask → agreed →
   drafting → submitted and wraps around. */
.recst{
  font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;
  padding:5px 10px;min-height:28px;border-radius:20px;border:1px solid var(--line);
  color:var(--muted);flex-shrink:0;
}
.recst.st-agreed{color:var(--blue);border-color:var(--blue)}
.recst.st-drafting{color:var(--amber);border-color:var(--amber);background:var(--amber-lo)}
.recst.st-submitted{color:var(--green);border-color:var(--green);background:var(--green-lo)}
.chase{font-size:11px;color:var(--blue);text-decoration:underline;text-underline-offset:2px;padding:4px 0;flex-shrink:0}
.recmeta .chase{margin-left:8px}

/* ---------- Documents ---------- */
.recst.dst-draft{color:var(--blue);border-color:var(--blue)}
.recst.dst-review{color:var(--amber);border-color:var(--amber);background:var(--amber-lo)}
.recst.dst-final{color:var(--green);border-color:var(--green);background:var(--green-lo)}

/* ---------- Application status ---------- */
.statusrow{
  display:flex;align-items:center;gap:10px;flex-wrap:wrap;
  padding:10px 0 2px;border-top:1px solid var(--line);margin-top:10px;
}
.statusrow label{font-size:10px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
.stsel{
  background:var(--ink-3);border:1px solid var(--line);border-radius:20px;
  color:var(--paper);font:inherit;font-size:12px;font-weight:600;padding:6px 12px;min-height:32px;
}
.stsel.ap-submitted{border-color:var(--blue);color:var(--blue)}
.stsel.ap-interview{border-color:var(--amber);color:var(--amber)}
.stsel.ap-offer,.stsel.ap-accepted{border-color:var(--green);color:var(--green)}
.dledit .urlin{width:100%;max-width:none}
.dledit select{
  background:var(--ink-3);border:1px solid var(--line);border-radius:6px;
  color:var(--paper);font:inherit;font-size:12px;padding:5px 6px;
}

/* ---------- Dashboard pipeline ---------- */
.pipe{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px}
.pipe .pstage{
  flex:1 1 auto;min-width:88px;border:1px solid var(--line);border-radius:10px;
  background:var(--ink-2);padding:9px 11px;
}
.pipe .pstage .pv{font-size:19px;font-weight:600;line-height:1.1}
.pipe .pstage .pk{font-size:9px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin-top:3px}
.pipe .pstage.hot .pv{color:var(--amber)}
.pipe .pstage.good .pv{color:var(--green)}

/* ---------- Verify checklist ---------- */
.vrow{display:flex;align-items:center;gap:10px;padding:9px 0;font-size:13px}
.vrow+.vrow{border-top:1px solid var(--line)}
.vname{flex:1;min-width:0}

/* ---------- Funding pots ---------- */
.pots{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:12px}
.pot{border:1px solid var(--line);border-radius:10px;background:var(--ink-2);padding:10px 12px;box-shadow:var(--lift)}
.pot:focus-within{border-color:var(--accent)}
.pot label{font-size:10px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);display:block}
.pot input{
  width:100%;background:none;border:none;color:var(--paper);
  font-family:'IBM Plex Mono',monospace;font-size:15px;padding:6px 0 0;
  -moz-appearance:textfield;
}
.pot input:focus{outline:none}
.pot input::-webkit-outer-spin-button,.pot input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
.gap-ok{color:var(--green);font-weight:600}
.gap-short{color:var(--red);font-weight:600}

/* ---------- Rounds editor (inside the deadline edit block) ---------- */
.rline{display:flex;gap:8px;align-items:center;margin:6px 0;flex-basis:100%}
/* Five rank fields will not sit on one phone-width line — let them wrap
   and keep each number box narrow so two or three fit per row. */
.rankedit .rline{flex-wrap:wrap;gap:10px}
.rankedit input[type=number]{width:56px}
.rankedit .ctryin{width:80px}
.dledit input[type=text],.dledit input[type=number]{
  background:var(--ink-3);border:1px solid var(--line);border-radius:6px;
  color:var(--paper);font:inherit;font-size:13px;padding:5px 8px;width:72px;
}
.rline .rx{color:var(--muted);font-size:12px;padding:4px 7px;border-radius:4px}
.rline .rx:hover{color:var(--red);background:var(--red-lo)}
/* A start window now carries its travel cadence as well as its date, which
   is six controls — more than one phone line holds, so it wraps and the
   cadence trio drops onto the row beneath the label and date. */
.iline{flex-wrap:wrap}
.iline .ilab{flex:1 1 90px;min-width:0}
.iline .itrips,.iline .idays{width:74px;flex:0 0 auto}
.iline .iwhere{flex:1 1 120px;min-width:0;width:auto}

/* ---------- Settings ---------- */
.set{border:1px solid var(--line);border-radius:12px;background:var(--ink-2);padding:4px 16px;margin-bottom:14px}
.setrow{display:flex;align-items:center;gap:14px;padding:14px 0;border-top:1px solid var(--line)}
.setrow:first-child{border-top:none}
.setlbl{flex:1;min-width:0}
/* Direct child only — a <b> used for emphasis inside the description text
   must stay inline, not become another heading. */
.setlbl > b{display:block;font-size:14px;font-weight:600}
.setlbl > span{display:block;font-size:12px;color:var(--muted);margin-top:3px;line-height:1.5}
.setlbl > span b{color:var(--paper);font-weight:600}
.setbtn{
  font-size:13px;font-weight:500;padding:11px 15px;min-height:44px;flex-shrink:0;
  border:1px solid var(--line);border-radius:10px;color:var(--paper);background:var(--ink-3);
}
.setbtn:hover{border-color:var(--accent);color:var(--accent)}
.setbtn:active{opacity:.7}
.setnote{font-size:11.5px;color:var(--muted);line-height:1.6;padding:0 0 14px}

/* Exchange-rate field. */
.fxbox{
  display:flex;align-items:center;gap:6px;flex-shrink:0;
  border:1px solid var(--line);border-radius:10px;background:var(--ink-3);
  padding:0 11px;min-height:44px;
}
.fxbox:focus-within{border-color:var(--accent)}
.fxsym,.fxper{font-size:13px;color:var(--muted);flex-shrink:0}
.fxbox input{
  width:88px;background:none;border:none;color:var(--paper);
  font-family:'IBM Plex Mono',monospace;font-size:14px;text-align:right;
  padding:11px 0;-moz-appearance:textfield;
}
.fxbox input:focus{outline:none}
.fxbox input::-webkit-outer-spin-button,
.fxbox input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}

/* One row per school in the logo picker. Buttons stay side by side even on
   a narrow phone — they are short, and stacking them would make this list
   18 screens long. */
/* The logo itself is the button for changing it. A separate "Choose" button
   per row would push each row onto two lines, and 18 of those is a very
   long scroll on a phone. */
.logobtn{
  position:relative;flex-shrink:0;width:44px;height:44px;
  display:grid;place-items:center;border-radius:10px;
}
.logobtn .logo{width:34px;height:34px}
.logobtn::after{
  content:'';position:absolute;right:1px;bottom:1px;width:13px;height:13px;
  border-radius:50%;background:var(--ink-3);border:1px solid var(--line);
  background-image:linear-gradient(var(--muted),var(--muted));
  background-size:7px 1.5px;background-position:center;background-repeat:no-repeat;
  box-shadow:0 0 0 2px var(--ink-2);
}
.logobtn:active{opacity:.6}
.logosrc{font-family:'IBM Plex Mono',monospace;font-size:11px}
.resetlink{
  font-size:11px;color:var(--blue);text-decoration:underline;
  padding:4px 0;margin-top:2px;display:inline-block;
}
/* An excluded school stays listed here — greyed, not hidden — so you can
   always find it again to switch it back on. */
.logorow.off .logo,.logorow.off .setlbl > b{opacity:.4}
.logorow.off .setlbl > b{text-decoration:line-through}

/* ---------- Empty ---------- */
.empty{padding:40px 20px;text-align:center;color:var(--muted);font-size:14px;border:1px dashed var(--line);border-radius:12px}

/* ---------- Ask ----------
   A tab of its own rather than a floating sheet. The composer is the one
   fixed piece: it sits just above the tab bar so the thread scrolls under
   it, which is why the message list carries bottom padding to match. */
.aihead{display:flex;align-items:center;gap:10px;padding:0 0 12px;flex-shrink:0}
.aititle{font-family:'Fraunces',serif;font-size:21px;font-weight:600;flex:1;min-width:0}
.aititle .aimodel{
  display:block;font-family:'IBM Plex Mono',monospace;font-size:10.5px;
  font-weight:400;color:var(--muted);margin-top:3px;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
}
.aihx{font-size:12px;color:var(--muted);padding:8px 10px;border-radius:8px;flex-shrink:0}
.aihx:hover{color:var(--paper);background:var(--ink-3)}

.aimsgs{display:flex;flex-direction:column;gap:14px;padding-bottom:8px}

/* Openers, so a blank Ask tab is still a place you can start from. */
.aisugs{display:grid;gap:8px;margin-top:16px}
.aisug{
  display:flex;align-items:center;gap:11px;width:100%;
  padding:13px 14px;border:1px solid var(--line);border-radius:12px;
  background:var(--ink-2);text-align:left;
}
.aisug:active{background:var(--ink-3)}
.aisug .tag{
  font-family:'IBM Plex Mono',monospace;font-size:9px;letter-spacing:.06em;
  color:var(--accent);flex-shrink:0;
}
.aisug .q{flex:1;min-width:0;font-size:13.5px;line-height:1.35}
.aimsg{max-width:88%;font-size:14px;line-height:1.6}
.aimsg.me{align-self:flex-end;background:var(--accent-lo);border:1px solid var(--accent);border-radius:14px 14px 4px 14px;padding:9px 13px;white-space:pre-wrap;word-wrap:break-word}
.aimsg.ai{align-self:flex-start;max-width:100%}
.aimsg.ai .aibody{background:var(--ink-3);border:1px solid var(--line);border-radius:14px 14px 14px 4px;padding:11px 13px;word-wrap:break-word;overflow-wrap:anywhere}
.aimsg.err .aibody{border-color:var(--red);background:var(--red-lo)}
.aibody p{margin:0 0 8px}
.aibody p:last-child{margin-bottom:0}
.aibody ul{margin:0 0 8px;padding-left:20px}
.aibody li{margin:2px 0}
.aibody code{font-family:'IBM Plex Mono',monospace;font-size:12.5px;background:var(--ink);padding:1px 5px;border-radius:4px}
.aibody h4{font-size:14px;font-weight:700;margin:10px 0 4px}
.aibody h4:first-child{margin-top:0}
/* The model that produced the answer, stated on every single reply — a
   fallback means you are not reading what you think you are reading. */
.aiby{font-family:'IBM Plex Mono',monospace;font-size:10.5px;color:var(--muted);margin-top:5px;padding-left:2px}
.aiby b{color:var(--accent);font-weight:600}
.aiby .fell{color:var(--amber)}
.aiempty{margin:auto;text-align:center;color:var(--muted);font-size:13px;line-height:1.7;padding:0 12px}
.aiempty b{display:block;color:var(--paper);font-size:15px;margin-bottom:6px}
.aidots{display:inline-flex;gap:4px;align-items:center}
.aidots i{width:5px;height:5px;border-radius:50%;background:var(--muted);animation:aiblink 1.2s infinite}
.aidots i:nth-child(2){animation-delay:.2s}
.aidots i:nth-child(3){animation-delay:.4s}
@keyframes aiblink{0%,60%,100%{opacity:.25}30%{opacity:1}}

/* Fixed above the tab bar. 84px clears the nav pill (60px tall, sitting
   12px off the bottom) with a little air between the two. */
.aifoot{
  position:fixed;z-index:29;left:50%;transform:translateX(-50%);
  bottom:calc(84px + env(safe-area-inset-bottom));
  width:min(560px,calc(100% - 24px));
  background:var(--ink-2);border:1px solid var(--line);border-radius:22px;
  box-shadow:var(--lift);padding:8px 10px;
}
.aifoot[hidden]{display:none}
.aictx{display:flex;align-items:center;gap:7px;font-size:11px;color:var(--muted);padding:2px 4px 8px}
.aictx input{accent-color:var(--accent);width:15px;height:15px;flex-shrink:0}
.aictx label{cursor:pointer}
/* The composer grows with the text rather than scrolling inside a fixed
   box — align-items:flex-end keeps the send button pinned to the last line
   as the field gets taller. */
.aicomposer{display:flex;align-items:flex-end;gap:8px}
.aicomposer textarea{
  flex:1;min-width:0;resize:none;overflow-y:auto;
  min-height:44px;max-height:168px;
  background:var(--ink-3);border:1px solid var(--line);border-radius:14px;
  color:var(--paper);font:inherit;font-size:14px;line-height:1.5;
  padding:11px 14px;
}
.aicomposer textarea:focus{outline:none;border-color:var(--accent)}
.aisend{
  width:44px;height:44px;flex-shrink:0;border-radius:50%;display:grid;place-items:center;
  background:var(--accent);color:var(--on-accent);font-size:18px;line-height:1;
}
.aisend:disabled{opacity:.4;cursor:default}
.aisend:active:not(:disabled){opacity:.75}

/* Settings — stored keys. */
.keyrow .setlbl > b{font-family:'IBM Plex Mono',monospace;font-size:13px}
.keymask{font-family:'IBM Plex Mono',monospace;font-size:11px;color:var(--muted)}
.keyrow.on{background:var(--accent-lo);border-radius:8px;padding-left:10px;padding-right:10px;margin:2px -10px}
.keyrow .usebtn{font-size:12px;padding:8px 12px;min-height:44px}
.keyrow .inuse{font-size:11px;font-weight:600;letter-spacing:.07em;text-transform:uppercase;color:var(--accent);flex-shrink:0}
.keyadd{display:flex;flex-wrap:wrap;gap:8px;padding:0 0 14px}
.keyadd input{
  background:var(--ink-3);border:1px solid var(--line);border-radius:10px;
  color:var(--paper);font:inherit;font-size:13px;padding:11px 12px;min-height:44px;
}
.keyadd input:focus{outline:none;border-color:var(--accent)}
.keyadd .klabel{width:120px;flex:0 1 120px}
.keyadd .kval{flex:1 1 180px;min-width:0;font-family:'IBM Plex Mono',monospace;font-size:12px}
.keywarn{
  font-size:11.5px;line-height:1.6;color:var(--amber);
  background:var(--amber-lo);border-radius:8px;padding:9px 11px;margin:0 0 14px;
}

/* ================================================================
   Shape over prose
   ----------------------------------------------------------------
   The blocks below are the redesign: the things that used to be
   sentences and tables — a paragraph of bold labels, an 18-row
   runway, three stacked cost tables — become a ring, a strip of
   cards, four panes and one chart. Nothing here introduces a new
   colour or font; it is the same tokens arranged so the screen can
   be read at a glance rather than parsed.
   ================================================================ */

/* ---- Home: countdown ring + hero ---- */
.hero2{display:flex;align-items:center;gap:16px;padding:2px 0 18px}
.ringwrap{position:relative;width:104px;height:104px;flex-shrink:0}
.ringwrap svg{width:100%;height:100%;display:block;transform:rotate(-90deg)}
.ringwrap .track{fill:none;stroke:var(--ink-3)}
.ringwrap .arc{fill:none;stroke-linecap:round;transition:stroke-dashoffset .6s cubic-bezier(.4,0,.2,1)}
.ringmid{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.ringmid .n{font-family:'Fraunces',serif;font-size:32px;font-weight:700;line-height:1;letter-spacing:-.03em}
.ringmid .u{font-family:'IBM Plex Mono',monospace;font-size:8.5px;letter-spacing:.12em;color:var(--muted);margin-top:3px}
.hero2 .who{min-width:0}
.hero2 .eyebrow{font-family:'IBM Plex Mono',monospace;font-size:9.5px;letter-spacing:.13em;color:var(--muted);text-transform:none}
.hero2 .nm{display:flex;align-items:center;gap:9px;margin-top:7px;font-family:'Fraunces',serif;font-size:19px;font-weight:600;letter-spacing:-.02em;line-height:1.15}
.hero2 .dt{font-family:'IBM Plex Mono',monospace;font-size:11px;color:var(--muted);margin-top:7px}

/* ---- Home: three numbers ---- */
.pulse{display:flex;gap:8px;padding-bottom:20px}
.pbox{flex:1;min-width:0;border:1px solid var(--line);border-radius:12px;padding:10px 11px;background:var(--ink-2)}
.pbox .v{font-family:'IBM Plex Mono',monospace;font-size:20px;font-weight:600;line-height:1;font-variant-numeric:tabular-nums}
.pbox .k{font-family:'IBM Plex Mono',monospace;font-size:8.5px;letter-spacing:.09em;color:var(--muted);margin-top:6px;line-height:1.3}
/* The three numbers already carry their own bottom padding, so the usual
   28px section gap on top of it opens a hole. */
.pulse + .sechead{margin-top:4px}

/* ---- Home: the next few things to tick ---- */
.trow{
  display:flex;align-items:center;gap:12px;padding:13px 14px;
  border:1px solid var(--line);border-left:3px solid var(--accent);
  border-radius:12px;background:var(--ink-2);margin-bottom:8px;
}
.trow.over{border-color:rgba(248,113,113,.38);border-left-color:var(--red)}
.trow.week{border-left-color:var(--amber)}
.trow .mid{flex:1;min-width:0}
.trow .lab{font-size:14.5px;line-height:1.35}
.trow.done .lab{color:var(--muted);text-decoration:line-through}
.trow .ctx{display:flex;align-items:center;gap:7px;margin-top:5px;font-family:'IBM Plex Mono',monospace;font-size:10px;color:var(--muted)}
.trow .ctx .logo{width:13px;height:13px;border-radius:3px}
.trow .d{font-family:'IBM Plex Mono',monospace;font-size:10.5px;font-weight:600;flex-shrink:0;letter-spacing:.03em}
.seeall{
  width:100%;margin-top:2px;padding:11px;border:1px solid var(--line);border-radius:12px;
  text-align:center;font-family:'IBM Plex Mono',monospace;font-size:10.5px;
  letter-spacing:.08em;color:var(--muted);
}
.seeall:active{background:var(--ink-3)}

/* ---- Home: runway strip ----
   Bleeds past the page padding on both sides so the first and last card
   sit flush with the screen edge when scrolled, which is the cue that
   there is more to the right. */
.runway{display:flex;gap:10px;overflow-x:auto;padding:2px var(--pad) 4px;margin:0 calc(-1 * var(--pad));scrollbar-width:none}
.runway::-webkit-scrollbar{display:none}
.rwcard{
  flex:none;width:146px;border:1px solid var(--line);border-radius:14px;
  background:var(--ink-2);padding:13px;display:flex;flex-direction:column;gap:9px;
  box-shadow:var(--lift);text-align:left;
}
.rwcard.soon{border-color:rgba(248,113,113,.38)}
.rwcard:active{background:var(--ink-3)}
.rwtop{display:flex;align-items:center;justify-content:space-between;gap:8px}
.rwcard .nm{font-size:13px;font-weight:600;line-height:1.25;letter-spacing:-.01em;min-height:32px}
.rwcard .d{font-family:'IBM Plex Mono',monospace;font-size:15px;font-weight:600;font-variant-numeric:tabular-nums}
.rwcard .pg{font-family:'IBM Plex Mono',monospace;font-size:9px;color:var(--muted);letter-spacing:.05em}
.rwnext{display:flex;align-items:flex-start;gap:5px;padding-top:8px;border-top:1px solid var(--line)}
.rwnext .car{flex-shrink:0;font-size:10px;line-height:1.35}
.rwnext .tx{font-size:11px;line-height:1.35}
.rwnext.clear .car,.rwnext.clear .tx{color:var(--green)}

/* ---- Seven segments: a school's state without opening it ---- */
.dotbar{display:flex;gap:3px}
.dotbar span{flex:1;height:4px;border-radius:2px;background:var(--ink-3);display:block}
.dotbar span.done{background:var(--green)}
.dotbar span.over{background:var(--red)}
.dotbar span.soon{background:var(--amber)}

/* ---- Home: the estimate warning, as one row you can act on ---- */
.verifyrow{
  width:100%;display:flex;align-items:center;gap:12px;margin-top:24px;
  padding:13px 14px;border:1px solid var(--amber);border-radius:12px;background:var(--amber-lo);
}
.verifyrow .n{font-family:'Fraunces',serif;font-size:24px;font-weight:700;line-height:1;color:var(--amber);flex-shrink:0}
.verifyrow .t{flex:1;min-width:0;font-size:13.5px;font-weight:600;color:var(--amber)}
.verifyrow .s{font-family:'IBM Plex Mono',monospace;font-size:10px;color:var(--muted);margin-top:3px;font-weight:400}
.verifyrow .go{color:var(--amber);flex-shrink:0;font-size:15px}
.backlink{font-family:'IBM Plex Mono',monospace;font-size:10.5px;letter-spacing:.08em;color:var(--muted);padding:4px 0 12px}

/* ---- School card: four panes instead of a paragraph ---- */
.panes{display:flex;gap:2px;padding:9px 12px 0}
.panebtn{
  flex:1;padding:10px 4px;border-radius:9px;text-align:center;
  font-family:'IBM Plex Mono',monospace;font-size:9.5px;font-weight:600;
  letter-spacing:.06em;color:var(--muted);
}
.panebtn.on{background:var(--accent-lo);color:var(--accent)}
.panebody{padding:4px 14px 14px}
/* One-pixel gaps over a line-coloured backing draw the grid rules without
   a border on every cell. */
.factgrid{display:grid;grid-template-columns:1fr 1fr;gap:1px;background:var(--line);margin:8px 0 0}
.factcell{background:var(--ink-2);padding:11px 12px;min-width:0}
.factcell .k{font-family:'IBM Plex Mono',monospace;font-size:8.5px;letter-spacing:.1em;color:var(--muted)}
.factcell .v{font-size:13.5px;margin-top:5px;line-height:1.35;overflow-wrap:anywhere}
.factcell .v.amber,.cinfo .amber{color:var(--amber)}
.factcell .v.green,.cinfo .green{color:var(--green)}
.factcell .v.red,.cinfo .red{color:var(--red)}
.factcell .v.dim,.cinfo .dim{color:var(--muted)}
/* Travel load on the collapsed row — the one fact that decides whether a
   programme is possible at all, so it does not wait for a tap. */
.trav{font-family:'IBM Plex Mono',monospace;font-size:9px;font-weight:600;letter-spacing:.05em;padding:2px 6px;border-radius:4px;white-space:nowrap}
.trav.green{background:var(--green-lo);color:var(--green)}
.trav.amber{background:var(--amber-lo);color:var(--amber)}
.trav.red{background:var(--red-lo);color:var(--red)}
.trav.dim{background:var(--ink-3);color:var(--muted)}

/* ---- School card: money pane ---- */
.moneytop{display:flex;align-items:baseline;justify-content:space-between;gap:10px}
.moneytop .k{font-family:'IBM Plex Mono',monospace;font-size:9px;letter-spacing:.1em;color:var(--muted)}
.moneytop .v{font-family:'IBM Plex Mono',monospace;font-size:17px;font-weight:600}
.splitbar{height:8px;border-radius:4px;background:var(--ink-3);overflow:hidden;margin-top:10px;display:flex}
.splitbar .tui{background:var(--accent);height:100%}
.splitbar .liv{background:var(--blue);height:100%}
.splitkey{display:flex;gap:14px;margin-top:9px;font-family:'IBM Plex Mono',monospace;font-size:9.5px;color:var(--muted);flex-wrap:wrap}
.splitkey span{display:flex;align-items:center;gap:5px}
.swatch{width:7px;height:7px;border-radius:2px;display:block;flex-shrink:0}
.gapbox{margin-top:14px;padding:11px 12px;border-radius:10px;border:1px solid var(--line)}
.gapbox.ok{border-color:var(--green);background:var(--green-lo)}
.gapbox.short{border-color:var(--red);background:var(--red-lo)}
.gapbox .k{font-family:'IBM Plex Mono',monospace;font-size:8.5px;letter-spacing:.1em;color:var(--muted)}
.gapbox .v{font-size:14px;font-weight:600;margin-top:5px}
.gapbox.ok .v{color:var(--green)}
.gapbox.short .v{color:var(--red)}

/* ---- Costs: one affordability chart in place of three tables ---- */
.fundcard{border:1px solid var(--line);border-radius:14px;background:var(--ink-2);padding:14px;box-shadow:var(--lift)}
.fundtop{display:flex;align-items:baseline;justify-content:space-between;gap:10px}
.fundtop .k{font-family:'IBM Plex Mono',monospace;font-size:9px;letter-spacing:.11em;color:var(--muted)}
.fundtop .v{font-family:'Fraunces',serif;font-size:24px;font-weight:700;letter-spacing:-.02em;color:var(--accent)}
.potstack{height:10px;border-radius:5px;background:var(--ink-3);overflow:hidden;margin-top:11px;display:flex}
.potstack i{height:100%;display:block}
/* The line every bar is measured against, labelled where it falls. */
.affmarkrow{position:relative;height:19px;padding:0 13px;margin-bottom:1px}
.affmarklab{
  position:absolute;bottom:0;transform:translateX(-50%);white-space:nowrap;
  padding:2px 7px;border-radius:5px;background:var(--paper);color:var(--ink);
  font-family:'IBM Plex Mono',monospace;font-size:8.5px;font-weight:600;letter-spacing:.05em;
}
.affrow{
  display:block;width:100%;padding:10px 12px;margin-bottom:7px;
  border:1px solid var(--line);border-radius:11px;background:var(--ink-2);text-align:left;
}
.affrow.on{border-color:var(--accent);background:var(--accent-lo)}
.afftop{display:flex;align-items:center;gap:9px}
.afftop .nm{flex:1;min-width:0;font-size:13px;font-weight:500;letter-spacing:-.01em;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.afftop .amt{font-family:'IBM Plex Mono',monospace;font-size:12px;font-weight:600;flex-shrink:0}
.afftop .amt.ok{color:var(--green)}
.afftrack{position:relative;height:6px;border-radius:3px;background:var(--ink-3);overflow:hidden;margin-top:9px}
.afffill{position:absolute;left:0;top:0;bottom:0;border-radius:3px;background:var(--accent)}
.afffill.ok{background:var(--green)}
.afffill.short{background:var(--red)}
.affmark{position:absolute;top:-2px;bottom:-2px;width:2px;background:var(--paper)}
.affkey{display:flex;align-items:center;gap:14px;margin-top:10px;font-family:'IBM Plex Mono',monospace;font-size:9.5px;color:var(--muted)}
.affkey span{display:flex;align-items:center;gap:5px}

/* ---- Plan: sub-tabs, step rings, action groups ---- */
.subtabs{display:flex;gap:2px;padding:0 0 14px}
.subtab{
  flex:1;padding:11px 4px;border-radius:10px;text-align:center;
  font-family:'IBM Plex Mono',monospace;font-size:10px;font-weight:600;
  letter-spacing:.06em;color:var(--muted);
}
.subtab.on{background:var(--accent-lo);color:var(--accent)}
.stepring{position:relative;width:38px;height:38px;flex-shrink:0}
.stepring svg{width:100%;height:100%;display:block;transform:rotate(-90deg)}
.stepring .track{fill:none;stroke:var(--ink-3)}
.stepring .arc{fill:none;stroke-linecap:round;transition:stroke-dashoffset .6s cubic-bezier(.4,0,.2,1)}
.stepring .num{position:absolute;inset:0;display:grid;place-items:center;font-family:'IBM Plex Mono',monospace;font-size:10px;font-weight:600}
/* Urgent cannot hide inside a flat list, so the list is not flat. */
.ghead{display:flex;align-items:center;gap:8px;padding:0 2px 8px}
.ghead .dot2{width:8px;height:8px;border-radius:3px;display:block;flex-shrink:0}
.ghead .t{font-family:'IBM Plex Mono',monospace;font-size:9.5px;font-weight:600;letter-spacing:.13em}
.ghead .rule{flex:1;height:1px;background:var(--line);display:block}
.ghead .c{font-family:'IBM Plex Mono',monospace;font-size:9.5px;color:var(--muted)}
.agroup{border:1px solid var(--line);border-radius:13px;padding:4px 14px 14px;margin-bottom:18px}
.agroup.now{border-color:rgba(248,113,113,.38);background:var(--ink-2)}
.agroup .task:first-child{border-top:none}
.gempty{padding:14px 0;font-size:13px;color:var(--muted)}

/* ---- More: quick actions ---- */
.qarow{display:flex;gap:8px;margin-bottom:16px}
.qabtn{flex:1;padding:13px 10px;border:1px solid var(--line);border-radius:12px;background:var(--ink-2);text-align:center}
.qabtn:active{background:var(--ink-3)}
.qabtn .ic{font-size:17px;line-height:1}
.qabtn .lb{font-family:'IBM Plex Mono',monospace;font-size:9px;letter-spacing:.06em;color:var(--muted);margin-top:7px}

/* ---------- Toast ---------- */
#toast{
  position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(120%);
  background:var(--ink-3);border:1px solid var(--line);border-radius:10px;
  padding:11px 18px;font-size:13px;z-index:50;transition:transform .25s ease;
  box-shadow:0 8px 28px var(--shadow);max-width:calc(100vw - 40px);
}
#toast.show{transform:translateX(-50%) translateY(0)}

/* ---------- Phone ----------
   Primary target is a Galaxy S24 Ultra (~412 CSS px wide). Tap targets are
   kept at 44px or more, and anything that would force sideways scrolling of
   the page itself is stacked instead. */
@media(max-width:640px){
  main{--pad:14px;padding:18px var(--pad) calc(92px + env(safe-area-inset-bottom))}
  .hwrap{padding:10px 14px;gap:9px}
  .days{font-size:44px}
  .hero-top{padding:16px}
  .hero-school{margin-left:0;text-align:left;width:100%}
  .hero-school .n{justify-content:flex-start}
  .hero-bar{flex-wrap:wrap}
  .stat{min-width:50%;border-bottom:1px solid var(--line)}
  .brand{font-size:16px}
  .sync span{display:none}
  .chead{padding:13px 14px;gap:10px}
  .cbody{padding:6px 14px 14px}
  .logo{width:28px;height:28px}
  .task{padding:10px 0}
  .cb{width:22px;height:22px}
  .setrow{gap:10px}
  .setbtn{padding:11px 13px}
}

/* Narrow phones — stack each settings row so the button keeps its full
   width instead of squeezing the label. */
@media(max-width:430px){
  .setrow{flex-wrap:wrap}
  .setlbl{flex:1 1 100%}
  .setrow .setbtn{width:100%}
  .setrow .switch{margin-left:auto}
  /* Keep the logo rows on one line. The generic rule above stretches
     buttons to full width, which would turn this 18-row list into a very
     long scroll and squeeze the school name into three lines. */
  .logorow .setbtn{width:auto;flex:0 0 auto}
  .logorow .setlbl{flex:1 1 0}
  /* Same exception for the stored keys: a full-width "Use this" doubles the
     height of every row, and the label beside it is two short lines. */
  .keyrow .setbtn{width:auto;flex:0 0 auto}
  .keyrow .setlbl{flex:1 1 0}
}
</style>
