<script src="seed.js"></script>
<script type="module" src="sync.js"></script>
<script>
/* ================================================================
   Storage — everything lives in this browser's localStorage under
   one key. No accounts, no server. Use Backup / Restore to move
   your data between browsers or devices.
   ================================================================ */
const STORE_KEY = 'emba-tracker-v' + SEED_VERSION;

/* App version — bump this and CACHE_VERSION in sw.js together whenever
   index.html / seed.js / sync.js change. Shown in the header; clicking it
   hard-refreshes (drops the service-worker caches and reloads). */
const APP_VERSION = 'v1.21.0';

/* ---------------- State ---------------- */
let data = null;
const $  = (s) => document.querySelector(s);
const $$ = (s) => Array.from(document.querySelectorAll(s));

/* ---------------- Utils ---------------- */
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, c =>
  ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]));

function today() { const d = new Date(); d.setHours(0,0,0,0); return d; }

/* Today as YYYY-MM-DD in LOCAL time. toISOString() would convert to UTC
   first, which west of Greenwich — or at midnight in Lagos — lands on the
   wrong day. */
function todayISO() {
  const d = new Date();
  return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') +
    '-' + String(d.getDate()).padStart(2, '0');
}

function daysTo(iso) {
  if (!iso) return null;
  const d = new Date(iso + 'T00:00:00');
  if (isNaN(d)) return null;
  return Math.round((d - today()) / 86400000);
}

function dueClass(n) {
  if (n === null) return '';
  if (n < 0)  return 'crit';
  if (n <= 14) return 'crit';
  if (n <= 45) return 'warn';
  return 'ok';
}

function dueText(n) {
  if (n === null) return '—';
  if (n < 0)   return `${Math.abs(n)}d over`;
  if (n === 0) return 'Today';
  if (n === 1) return '1 day';
  return `${n} days`;
}

function fmtDate(iso) {
  if (!iso) return '—';
  const d = new Date(iso + 'T00:00:00');
  if (isNaN(d)) return '—';
  return d.toLocaleDateString('en-GB', { day:'numeric', month:'short', year:'numeric' });
}

/* ---------------- Money formatting ----------------
   Every cost in seed.js is held in USD. If you have set an exchange rate in
   Settings, the naira equivalent is shown in brackets beside every figure.
   No rate set means no brackets: the app will not invent a rate, because a
   stale guess is worse than no number at all. */
function fxRate() {
  const r = Number(data && data.fx && data.fx.ngnPerUsd);
  return r > 0 ? r : null;
}

/* Naira figures for a £100k course run to nine digits, which would wreck a
   table column, so anything over a thousand is abbreviated. */
function ngn(usdAmount) {
  const rate = fxRate();
  if (rate === null) return '';
  const n = Number(usdAmount || 0) * rate;
  if (n >= 1e9) return '₦' + (n / 1e9).toFixed(n < 1e10 ? 2 : 1) + 'bn';
  if (n >= 1e6) return '₦' + (n / 1e6).toFixed(n < 1e7 ? 1 : 0) + 'm';
  if (n >= 1e3) return '₦' + Math.round(n / 1e3).toLocaleString('en-GB') + 'k';
  return '₦' + Math.round(n);
}

const usdOnly = (n) => '$' + Number(n || 0).toLocaleString('en-GB');

/* The standard money renderer used everywhere a figure appears. */
function usd(n) {
  const naira = ngn(n);
  return usdOnly(n) + (naira ? ` (${naira})` : '');
}

/* ---------------- Excluded schools ----------------
   A school you switch off in Settings stays in your data — it is only
   filtered out of the lists and the counts. Nothing is deleted, so
   switching it back on restores its ticks and notes untouched. */
function isExcluded(id) {
  return !!(data && data.excluded && data.excluded[id]);
}
function activeSchools() {
  return (data.schools || []).filter((s) => !isExcluded(s.id));
}

function toast(msg) {
  const t = $('#toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(t._t);
  t._t = setTimeout(() => t.classList.remove('show'), 2400);
}

function pct(tasks) {
  if (!tasks || !tasks.length) return 0;
  return Math.round(tasks.filter(t => t.done).length / tasks.length * 100);
}

/* ---------------- Load, seed, persist ---------------- */
function loadData() {
  try {
    const raw = localStorage.getItem(STORE_KEY);
    if (raw) return JSON.parse(raw);
  } catch (e) {
    console.error('Could not read saved data', e);
  }
  return null;
}

let applyingRemote = false;

/* ---------------- Who wrote what ----------------
   Sync used to decide which copy of the tracker was newer by comparing
   `updatedAt`, which is Date.now() on whichever device did the writing.
   That works only if every device agrees what time it is. They do not: a
   phone with the clock a few minutes fast stamps a timestamp none of the
   others can beat, so from then on it rejects every genuine update while
   still reporting "Synced" — schools you switched off reappear, dates stay
   old, and nothing looks broken.

   So no clocks. Each device gets a random id, each write gets a counter,
   and the shared document is simply the truth: adopt anything that is not
   the echo of our own last write. The one exception is an edit made while
   offline, which has to be pushed rather than thrown away.

   updatedAt is still written — snapshots and the backup file display it —
   but nothing merges on it any more. */
const DEVICE_KEY = 'emba-device-id';
let deviceId = localStorage.getItem(DEVICE_KEY);
if (!deviceId) {
  deviceId = 'd' + Math.random().toString(36).slice(2, 10);
  try { localStorage.setItem(DEVICE_KEY, deviceId); } catch (e) {}
}

// Identity of one particular write, so we can recognise our own echo and
// skip snapshots that carry something we already have.
const stampOf = (d) => `${(d && d.writer) || '?'}:${(d && d.rev) || 0}`;
let lastApplied = '';

// An edit that never reached Firestore. Until it does, remote data must
// not overwrite it.
let pendingLocal = false;

function save() {
  if (!data) return;
  data.updatedAt = Date.now();
  data.rev = (Number(data.rev) || 0) + 1;
  data.writer = deviceId;
  try {
    localStorage.setItem(STORE_KEY, JSON.stringify(data));
  } catch (e) {
    console.error('Save failed', e);
    toast('Could not save — browser storage is full or blocked');
  }
  if (window.EmbaSync && !applyingRemote) {
    lastApplied = stampOf(data);
    window.EmbaSync.push(data).then((ok) => {
      pendingLocal = !ok;
      if (!ok) setSyncStatus('pending');
    });
  }
}

/* Add anything new in seed.js (schools/steps/actions/funding you add later,
   fields on existing records) to an existing save, without touching ticks,
   notes, or edited deadlines already there. Runs on every load; cheap no-op
   once nothing's missing. */
function migrate(d) {
  let changed = false;
  const seed = buildSeed();

  (d.schools || []).forEach((s) => {
    if (s.notes === undefined) { s.notes = ''; changed = true; }
    if (!Array.isArray(s.recs))   { s.recs = [];   changed = true; }
    if (!Array.isArray(s.rounds)) { s.rounds = []; changed = true; }
    if (!Array.isArray(s.docs))   { s.docs = [];   changed = true; }
    if (s.appFeeUsd === undefined) { s.appFeeUsd = null; changed = true; }
    // Where the application actually stands, independent of the task ticks.
    if (s.status === undefined) {
      s.status = (s.tasks || []).find((t) => t.id === 'submit')?.done ? 'submitted' : 'none';
      changed = true;
    }
    // Scholarship money has its own deadline at several schools.
    if (s.schDeadline === undefined) { s.schDeadline = null; changed = true; }
    // The admissions page to check a date against.
    if (s.url === undefined) { s.url = ''; changed = true; }
    // A round can belong to one start window; null means it applies to all.
    (s.rounds || []).forEach((r) => {
      if (r.win === undefined) { r.win = null; changed = true; }
    });
    // QS Executive MBA 2026 ranks. Taken from the seed on first run so
    // existing data picks up the published numbers, then left alone — an
    // edited rank is yours and is never written back over.
    const sd = (seed.schools || []).find((x) => x.id === s.id);
    if (s.country === undefined) { s.country = sd?.country || ''; changed = true; }
    if (!s.rank) {
      s.rank = sd ? { ...sd.rank } : { global: null, country: null, europe: null, joint: null };
      changed = true;
    }
  });

  // Intake alignment — the target is programmes starting in 2027. Earlier
  // seed data carried 2026 start dates (and a Cambridge countdown built
  // around the Sep 2026 intake). Each field is rewritten only if it still
  // holds the old seed value, so anything you edited by hand is left alone.
  const START_2027 = {
    'cambridge-emba':   ['Sep 2026', 'Sep 2027'],
    'insead-gemba':     ['Nov 2026', 'Nov 2027'],
    'oxford-said':      ['20 Sep 2026 / 17 Jan 2027', 'Jan 2027 / Sep 2027'],
    'lbs-emba':         ['Sep 2026', 'Sep 2027'],
    'trium':            ['6 Sep 2026', 'Sep 2027'],
    'booth-emba':       ['Sep 2026', 'Sep 2027'],
    'wharton-emba':     ['~May 2026', '~May 2027'],
    'columbia-lbs':     ['May 2026', 'May 2027'],
    'kellogg-emba':     ['Jan/Sep', 'Jan 2027 / Sep 2027'],
    'mit-sloan':        ['~Jul 2026', '~Jul 2027'],
    'escp-emba':        ['Sep 2026 / Jan 2027', 'Jan 2027 / Sep 2027'],
    'sda-bocconi':      ['Late 2026', 'Late 2027'],
    'imperial-emba':    ['Sep/Oct 2026', 'Sep/Oct 2027'],
    'manchester-gemba': ['Jan/Jul', 'Jan 2027 / Jul 2027'],
  };
  (d.schools || []).forEach((s) => {
    const m = START_2027[s.id];
    if (m && s.start === m[0]) { s.start = m[1]; changed = true; }
    if (s.id === 'cambridge-emba' && s.deadline === '2026-08-15') {
      s.deadline = '2026-11-15';
      s.deadlineNote = 'R1 estimate for Sep 2027 start — verify with Judge';
      s.flag = 'This deadline is an estimate for the Sep 2027 intake, not a confirmed date. Contact Cambridge Judge admissions to confirm round dates.';
      if (s.priority === 'URGENT') s.priority = 'HIGH';
      const st = (s.tasks || []).find((t) => t.id === 'submit');
      if (st && st.due === '2026-08-15') st.due = '2026-11-15';
      changed = true;
    }
    if (s.id === 'insead-gemba' && s.deadline === '2026-09-15') {
      s.deadline = '2027-02-15';
      s.deadlineNote = 'R1 estimate for Nov 2027 intake — confirm with INSEAD';
      s.estimated = true;
      const st = (s.tasks || []).find((t) => t.id === 'submit');
      if (st && st.due === '2026-09-15') st.due = '2027-02-15';
      changed = true;
    }
    if (s.id === 'imd-emba' && s.deadlineNote === 'Round 5') {
      s.deadlineNote = 'Round 5 — confirm it feeds a 2027 start';
      changed = true;
    }
  });
  // Start windows — most programmes run two intakes a year. Each becomes its
  // own entry so one can be switched off without losing the other.
  (d.schools || []).forEach((s) => {
    if (s.start === 'Jan/Sep 2027') { s.start = 'Jan 2027 / Sep 2027'; changed = true; }
    if (s.start === 'Jan/Jul 2027') { s.start = 'Jan 2027 / Jul 2027'; changed = true; }
    if (!Array.isArray(s.intakes)) {
      s.intakes = String(s.start || '').split(' / ').map((x) => x.trim())
        .filter(Boolean).map((label) => ({ label, on: true }));
      changed = true;
    }
    (s.intakes || []).forEach((iw) => {
      if (iw.deadline === undefined) { iw.deadline = null; changed = true; }
    });
    if (s.duration === undefined) { s.duration = ''; changed = true; }
  });

  /* Researched August 2026 — travel cadence, published rounds, admissions
     pages and the rest of the QS table. Additive throughout: a field you
     have already filled in or corrected is never written over, because the
     school telling you something on the phone beats anything read off a
     web page months earlier. */
  (d.schools || []).forEach((s) => {
    const sd = (seed.schools || []).find((x) => x.id === s.id);
    if (!sd) return;

    /* Start windows that gained real months. LBS's two streams differ by
       half the campus days, which is the whole reason for tracking
       cadence. IMD and HEC said "Rolling" and "Multiple intakes" — true,
       but you cannot count back six months from a word, so the rolling
       apply-by had nothing to anchor to. */
    const NEW_WINDOWS = {
      'lbs-emba':  { from: 'Sep 2027',         add: ['Jan 2027'] },
      'imd-emba':  { from: 'Rolling',          add: ['Apr 2027', 'Sep 2027'], replace: true },
      'hec-paris': { from: 'Multiple intakes', add: ['Mar 2027', 'Sep 2027'], replace: true },
    };
    const nw = NEW_WINDOWS[s.id];
    if (nw && s.start === nw.from) {
      const keep = nw.replace ? [] : (s.intakes || []);
      const added = nw.add
        .filter((l) => !keep.some((iw) => iw.label === l))
        .map((label) => ({ label, on: true, deadline: null, cadence: null }));
      s.intakes = [...added, ...keep];
      s.start = s.intakes.map((iw) => iw.label).join(' / ');
      changed = true;
    }

    // Cadence hangs off the start window, so match by label and fall back
    // to the school-wide figure for programmes with one format.
    (s.intakes || []).forEach((iw) => {
      if (iw.cadence) return;
      const c = cadenceFor(s.id, iw.label);
      if (c && c.days != null) { iw.cadence = c; changed = true; }
    });

    if (!s.url && sd.url) { s.url = sd.url; changed = true; }

    // Only where you have not entered any rounds yourself.
    if (!(s.rounds || []).length && (sd.rounds || []).length) {
      s.rounds = sd.rounds.map((r) => ({ ...r }));
      changed = true;
    }

    /* Where the dates come from — published, last year's calendar, or a
       rolling apply-by. Backfilled once so the card can say so.

       Rolling and prior-year rounds are also added to a school that
       already has rounds, because the earlier version of this app left
       those schools empty: an absent round there means "we never had
       any", not "you deleted them". Each is matched on label+date so
       running the migration twice cannot duplicate one, and anything
       you have since edited or removed by hand stays gone. */
    // Derived metadata, not something you can edit, so it is kept in step
    // with the seed rather than backfilled once and left to go stale.
    if (s.admissions !== sd.admissions) { s.admissions = sd.admissions || 'unknown'; changed = true; }
    if (s.rollingNote !== sd.rollingNote) { s.rollingNote = sd.rollingNote || ''; changed = true; }
    if (!s.roundsBackfilled && (sd.rounds || []).some((r) => r.est)) {
      const have = new Set((s.rounds || []).map((r) => `${r.label}|${r.date}`));
      sd.rounds.filter((r) => r.est && !have.has(`${r.label}|${r.date}`))
        .forEach((r) => s.rounds.push({ ...r }));
      s.rounds.sort((a, b) => String(a.date).localeCompare(String(b.date)));
      // Deliberately NOT touching s.estimated. Adding a derived round says
      // nothing about the deadline you already rang the school and
      // confirmed — flipping that back would throw away the one piece of
      // information here that came from a person rather than a web page.
      // The ~ on each round and the DATES FROM row carry the caveat.
      s.roundsBackfilled = true;
      changed = true;
    }

    /* A generated "Apply by" is only ever useful where the school gives
       you nothing else. Once one of its real rounds lands within a
       fortnight of the generated date, the pair reads as two deadlines
       when there is one — so the generated one goes. */
    const gen = (s.rounds || []).filter((r) => r.rolling);
    if (gen.length) {
      const real = (s.rounds || []).filter((r) => !r.rolling && r.date);
      const dup = gen.filter((g) => real.some((r) =>
        Math.abs(new Date(r.date + 'T00:00:00') - new Date(g.date + 'T00:00:00')) < 14 * 86400000));
      if (dup.length) {
        s.rounds = s.rounds.filter((r) => !dup.includes(r));
        changed = true;
      }
    }

    // Fill blanks in the rank object one field at a time.
    s.rank = s.rank || { global: null, country: null, europe: null, joint: null };
    ['global', 'country', 'europe', 'joint'].forEach((k) => {
      if (s.rank[k] == null && sd.rank && sd.rank[k] != null) { s.rank[k] = sd.rank[k]; changed = true; }
    });
  });

  const a1 = (d.actions || []).find((a) => a.id === 'a1');
  if (a1 && a1.label === 'Apply to Cambridge Judge EMBA (Sep 2026 start)') {
    a1.label = 'Apply to Cambridge Judge EMBA (Sep 2027 start)';
    if (a1.due === '2026-08-15') a1.due = '2026-11-15';
    changed = true;
  }

  ['schools', 'steps', 'actions'].forEach((key) => {
    d[key] = d[key] || [];
    const have = new Set(d[key].map((x) => x.id));
    (seed[key] || []).forEach((item) => {
      if (!have.has(item.id)) { d[key].push(item); changed = true; }
    });
  });

  d.funding = d.funding || [];
  const haveFunding = new Set(d.funding.map((f) => f.name));
  (seed.funding || []).forEach((f) => {
    if (!haveFunding.has(f.name)) { d.funding.push(f); changed = true; }
  });

  if (!d.logos || typeof d.logos !== 'object') { d.logos = {}; changed = true; }
  if (!d.excluded || typeof d.excluded !== 'object') { d.excluded = {}; changed = true; }
  if (!d.fx || typeof d.fx !== 'object') { d.fx = { ngnPerUsd: null }; changed = true; }
  // Funding pots — the four "how will I pay for it" numbers on the Costs tab.
  if (!d.pots || typeof d.pots !== 'object') {
    d.pots = { savings: null, employer: null, scholarship: null, loan: null };
    changed = true;
  }

  /* Gemini — your API keys and which one is currently in use. Kept on the
     data object so it rides the existing sync: add a key on the laptop and
     the phone has it too. See the security note above __ask() before you
     decide that is what you want. */
  if (!d.ai || typeof d.ai !== 'object') {
    d.ai = { keys: [], activeId: null, useContext: true };
    changed = true;
  }
  if (!Array.isArray(d.ai.keys)) { d.ai.keys = []; changed = true; }
  if (d.ai.activeId === undefined) { d.ai.activeId = null; changed = true; }
  if (d.ai.useContext === undefined) { d.ai.useContext = true; changed = true; }
  // A key deleted on another device leaves activeId pointing at nothing.
  if (d.ai.activeId && !d.ai.keys.some((k) => k.id === d.ai.activeId)) {
    d.ai.activeId = d.ai.keys[0]?.id || null;
    changed = true;
  }

  if (d.seedVersion !== SEED_VERSION) { d.seedVersion = SEED_VERSION; changed = true; }
  return changed;
}

/* ---------------- Application rounds ----------------
   A school can carry a list of round dates (R1/R2/R3…). The tracked
   deadline (s.deadline) always points at the round currently being aimed
   for. When that date passes and a later round exists, this rolls the
   tracker forward to it — on load, not mid-session, so a date never jumps
   while you are looking at it. The missed date is kept in s.rolledFrom so
   the school card can say so instead of silently moving the goalposts. */
function sortedRounds(s) {
  return (s.rounds || []).filter(r => r.date)
    .slice().sort((a, b) => (a.date < b.date ? -1 : 1));
}

/* Is the start window a round is tied to still switched on? A round with no
   window belongs to the school as a whole; a round naming a window that no
   longer exists is left visible rather than silently dropped. */
function winOn(s, label) {
  if (!label) return true;
  const w = (s.intakes || []).find(i => i.label === label);
  return !w || w.on;
}

/* Every date the school could be applying by: its rounds plus any deadline
   set on an active start window. The earliest upcoming one is what the
   tracker follows. Rounds belonging to a switched-off window drop out. */
function deadlineCandidates(s) {
  const wins = (s.intakes || []).filter(i => i.on && i.deadline)
    .map(i => ({ label: (i.label || 'intake') + ' intake', date: i.deadline }));
  return sortedRounds(s).filter(r => winOn(s, r.win)).concat(wins)
    .sort((a, b) => (a.date < b.date ? -1 : 1));
}

function rollRounds(d) {
  let changed = false;
  (d.schools || []).forEach(s => {
    const rs = deadlineCandidates(s);
    if (!rs.length || !s.deadline) return;
    if (daysTo(s.deadline) >= 0) return;              // still live — nothing to do
    const up = rs.find(r => daysTo(r.date) >= 0);     // next round still open
    if (!up || up.date <= s.deadline) return;
    s.rolledFrom = s.deadline;
    s.deadline = up.date;
    if (up.label) s.deadlineNote = up.label;
    const st = (s.tasks || []).find(t => t.id === 'submit');
    if (st) st.due = up.date;
    changed = true;
  });
  return changed;
}

function setSyncStatus(kind) {
  const dot = $('#dot'), txt = $('#syncTxt');
  // The listener reports "synced" on every snapshot, whether or not our own
  // last edit got out. If it did not, that is the fact worth showing.
  if (kind === 'synced' && pendingLocal) kind = 'pending';
  if (kind === 'synced')        { dot.className = 'dot';     txt.textContent = 'Synced'; }
  else if (kind === 'connecting') { dot.className = 'dot';   txt.textContent = 'Syncing…'; }
  // An edit that has not reached the cloud is not "Synced", and saying so
  // is the whole point — the old code claimed Synced regardless.
  else if (kind === 'pending')  { dot.className = 'dot off'; txt.textContent = 'Not sent yet'; }
  else if (kind === 'error')    { dot.className = 'dot off'; txt.textContent = 'Sync error'; }
  else if (kind === 'unconfigured') { dot.className = 'dot off'; txt.textContent = 'Sync not set up'; }
  else                           { dot.className = 'dot';     txt.textContent = 'On this device'; }
}

function handleRemote(remote) {
  if (!remote || applyingRemote) return;

  const stamp = stampOf(remote);

  // Already holding this exact write — our own echo, or a repeat snapshot.
  if (stamp === lastApplied) return;

  /* An edit we made with no connection has not reached anyone yet. Send it
     rather than letting the document overwrite it; the push updates the
     document, which comes back as our own echo and settles. */
  if (pendingLocal && data) {
    pendingLocal = false;
    lastApplied = stampOf(data);
    window.EmbaSync.push(data).then((ok) => { pendingLocal = !ok; });
    return;
  }

  applyingRemote = true;
  data = remote;
  migrate(data);
  try { localStorage.setItem(STORE_KEY, JSON.stringify(data)); } catch (e) {}
  lastApplied = stamp;
  render();
  applyingRemote = false;
}

/* Take the cloud copy, whatever this device currently thinks. The escape
   hatch for a device that has drifted: it does not wait for someone to
   change something elsewhere, and it ignores every local heuristic. */
window.__pull = async () => {
  if (!window.EmbaSync || !window.EmbaSync.available()) { toast('Sync is not set up here'); return; }
  toast('Fetching the cloud copy…');
  const remote = await window.EmbaSync.pull();
  if (!remote) { toast('Nothing in the cloud to pull'); return; }
  if (pendingLocal && !confirm(
    'This device has an edit that never reached the cloud. Pulling will discard it. Continue?')) return;
  applyingRemote = true;
  data = remote;
  migrate(data);
  try { localStorage.setItem(STORE_KEY, JSON.stringify(data)); } catch (e) {}
  lastApplied = stampOf(data);
  pendingLocal = false;
  render();
  applyingRemote = false;
  toast(`Pulled revision ${data.rev || 0} from the cloud`);
};

function waitForSync(cb, tries = 0) {
  if (window.EmbaSync) cb();
  else if (tries < 50) setTimeout(() => waitForSync(cb, tries + 1), 100);
}

/* Sync connects itself on load — nothing to turn on, nothing to enter.
   Every device reads and writes the same Firestore document. */
async function connectSync() {
  if (!window.EmbaSync || !window.EmbaSync.available()) {
    setSyncStatus('unconfigured');
    return;
  }
  setSyncStatus('connecting');
  await window.EmbaSync.connect({ onRemote: handleRemote, onStatus: setSyncStatus });
  // Give the first remote pull a moment to land, then take the daily
  // snapshot of whatever the merged truth is (once per day; see below).
  setTimeout(() => maybeSnapshot(), 6000);
}

/* ---------------- Theme (dark / light) ----------------
   Dark is the default. If the user has never chosen, we follow the phone's
   own setting; once they pick, their choice sticks and stops following it.
   Applied to <html> rather than <body> so the background is right before
   the first paint (see the inline script in <head>). */
const THEME_KEY = 'emba-theme';

function currentTheme() {
  return document.documentElement.getAttribute('data-theme') || 'dark';
}

function applyTheme(mode) {
  document.documentElement.setAttribute('data-theme', mode);
  const isLight = mode === 'light';
  // Sun when light is active, moon when dark — showing the state, not the action.
  const btn = $('#theme');
  if (btn) {
    btn.textContent = isLight ? '☀' : '☾';
    btn.title = isLight ? 'Light mode — tap for dark' : 'Dark mode — tap for light';
  }
  // Keep the Android status bar in step with the app.
  const meta = document.querySelector('meta[name="theme-color"]');
  if (meta) meta.setAttribute('content', isLight ? '#f0f4f8' : '#0f1117');
  // The Settings control is labelled "Light mode", so it reads as on when
  // light is the active theme.
  const sw = $('#themeSwitch');
  if (sw) {
    sw.className = 'switch' + (isLight ? ' on' : '');
    sw.setAttribute('aria-checked', isLight ? 'true' : 'false');
  }
}

function toggleTheme() {
  const next = currentTheme() === 'light' ? 'dark' : 'light';
  localStorage.setItem(THEME_KEY, next);
  applyTheme(next);
}

$('#theme').addEventListener('click', toggleTheme);
window.__toggleTheme = toggleTheme;
applyTheme(currentTheme());

/* ---------------- Version badge / hard refresh ---------------- */
$('#ver').textContent = APP_VERSION;

$('#ver').addEventListener('click', async () => {
  toast('Refreshing…');
  // Your data lives in localStorage and is NOT touched here — this only
  // drops the cached copies of index.html / seed.js / sync.js etc. so the
  // browser is forced to re-fetch them.
  try {
    if (window.caches) {
      const keys = await caches.keys();
      await Promise.all(keys.map((k) => caches.delete(k)));
    }
    if (navigator.serviceWorker) {
      const regs = await navigator.serviceWorker.getRegistrations();
      await Promise.all(regs.map((r) => r.unregister()));
    }
  } catch (e) {
    console.error('Cache clear failed', e);
  }
  location.reload();
});

function start() {
  data = loadData();
  if (!data) {
    data = buildSeed();
    // buildSeed covers the schools; migrate adds the containers that live
    // outside them (logos, fx, pots, ai) so a first run is not missing the
    // very fields the rest of the app assumes are there.
    migrate(data);
    save();
    toast('Tracker set up with your 18 schools');
  } else {
    const migrated = migrate(data);
    const rolled = rollRounds(data);
    if (migrated || rolled) save();
    if (rolled) toast('A missed round rolled forward to the next one — see the school card');
  }
  loadChat();
  render();

  waitForSync(() => connectSync());
}

/* ---------------- Backup / restore ---------------- */
window.__backup = () => {
  if (!data) return;
  const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = `emba-tracker-backup-${today().toISOString().slice(0, 10)}.json`;
  a.click();
  URL.revokeObjectURL(a.href);
  toast('Backup downloaded');
};

window.__restore = () => $('#importFile').click();

$('#importFile').addEventListener('change', async (e) => {
  const file = e.target.files[0];
  e.target.value = '';
  if (!file) return;
  try {
    const parsed = JSON.parse(await file.text());
    if (!Array.isArray(parsed.schools) || !Array.isArray(parsed.actions)) {
      toast('That file is not an EMBA tracker backup'); return;
    }
    if (!confirm('Replace everything in this browser with the backup file? Your current ticks will be overwritten.')) return;
    data = parsed;
    save();
    render();
    toast('Backup restored');
  } catch (err) {
    console.error('Restore failed', err);
    toast('Could not read that file');
  }
});

/* ---------------- Notes (per school) ---------------- */
$('#p-schools').addEventListener('change', (e) => {
  if (!e.target.classList.contains('notes')) return;
  const s = (data.schools || []).find(x => x.id === e.target.dataset.id);
  if (!s) return;
  s.notes = e.target.value;
  save();
});

/* ---------------- Calendar export ---------------- */
const icsEsc = (s) => String(s).replace(/\\/g, '\\\\').replace(/;/g, '\\;').replace(/,/g, '\\,').replace(/\n/g, '\\n');
const toICSDate = (iso) => iso.replace(/-/g, '');

function buildICS() {
  const stamp = new Date().toISOString().replace(/[-:]/g, '').split('.')[0] + 'Z';
  const lines = ['BEGIN:VCALENDAR', 'VERSION:2.0', 'PRODID:-//EMBA Tracker//EN', 'CALSCALE:GREGORIAN'];

  activeSchools().forEach(s => {
    // Scholarship money can close before — or after — the application does.
    if (s.schDeadline && !isClosed(s)) {
      lines.push(
        'BEGIN:VEVENT',
        'UID:sch-' + s.id + '@emba-tracker',
        'DTSTAMP:' + stamp,
        'DTSTART;VALUE=DATE:' + toICSDate(s.schDeadline),
        'SUMMARY:' + icsEsc(s.name + ' — scholarship deadline'),
        'DESCRIPTION:' + icsEsc(s.scholarshipTiming || ''),
        'END:VEVENT'
      );
    }
    if (!s.deadline || isSent(s)) return;
    lines.push(
      'BEGIN:VEVENT',
      'UID:school-' + s.id + '@emba-tracker',
      'DTSTAMP:' + stamp,
      'DTSTART;VALUE=DATE:' + toICSDate(s.deadline),
      'SUMMARY:' + icsEsc((s.estimated ? '[Estimated] ' : '') + s.name + ' — application deadline'),
      'DESCRIPTION:' + icsEsc(s.deadlineNote || ''),
      'END:VEVENT'
    );
  });

  (data.actions || []).forEach(t => {
    if (t.done || !t.due) return;
    lines.push(
      'BEGIN:VEVENT',
      'UID:action-' + t.id + '@emba-tracker',
      'DTSTAMP:' + stamp,
      'DTSTART;VALUE=DATE:' + toICSDate(t.due),
      'SUMMARY:' + icsEsc(t.label),
      'END:VEVENT'
    );
  });

  lines.push('END:VCALENDAR');
  return lines.join('\r\n');
}

window.__calendar = () => {
  if (!data) return;
  const blob = new Blob([buildICS()], { type: 'text/calendar;charset=utf-8' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'emba-deadlines.ics';
  a.click();
  URL.revokeObjectURL(a.href);
  toast('Calendar file downloaded — import it into your phone calendar');
};

/* ---------------- Toggle a task ---------------- */
window.__toggle = (scope, containerId, taskId) => {
  if (!data) return;
  let arr;
  if (scope === 'actions') {
    arr = data.actions;
  } else {
    const parent = (data[scope] || []).find(x => x.id === containerId);
    if (!parent) return;
    arr = parent.tasks;
  }
  const task = (arr || []).find(t => t.id === taskId);
  if (!task) return;
  task.done = !task.done;
  // Ticking a school's submit task is the same statement as moving it to
  // 'submitted', so keep the pipeline honest without a second tap. Untick
  // only walks it back if nothing later has happened since.
  if (scope === 'schools' && taskId === 'submit') {
    const s = (data.schools || []).find(x => x.id === containerId);
    if (s) {
      if (task.done && !isSent(s)) {
        s.status = 'submitted';
      } else if (!task.done && appStatus(s) === 'submitted') {
        s.status = 'drafting';
      } else if (!task.done && isSent(s)) {
        // Past submitted the school has already replied, so the application
        // demonstrably went out — unticking it would just contradict itself.
        task.done = true;
        toast(`${s.name} is at ${APP_LABEL[appStatus(s)]} — change the status to undo that`);
      }
    }
  }
  render();
  save();
};

/* ---------------- Custom tasks ---------------- */
function taskArrFor(scope, containerId) {
  if (scope === 'actions') return data.actions;
  const parent = (data[scope] || []).find(x => x.id === containerId);
  return parent ? parent.tasks : null;
}

window.__addTask = (scope, containerId) => {
  if (!data) return;
  const label = prompt('Task description:');
  if (!label || !label.trim()) return;
  const due = prompt('Due date as YYYY-MM-DD (leave blank for none):');
  if (due && !/^\d{4}-\d{2}-\d{2}$/.test(due.trim())) { toast('Date must look like 2026-09-30 — task not added'); return; }
  const arr = taskArrFor(scope, containerId);
  if (!arr) return;
  arr.push({ id: 'custom-' + Date.now(), label: label.trim(), due: due ? due.trim() : null, done: false, custom: true });
  render();
  save();
};

window.__delTask = (scope, containerId, taskId) => {
  if (!data) return;
  if (!confirm('Delete this task?')) return;
  const arr = taskArrFor(scope, containerId);
  if (!arr) return;
  const idx = arr.findIndex(t => t.id === taskId);
  if (idx > -1) arr.splice(idx, 1);
  render();
  save();
};

/* ---------------- Deadline editing ---------------- */
const editingDL = new Set();
window.__editDL = (id) => {
  editingDL.has(id) ? editingDL.delete(id) : editingDL.add(id);
  renderSchools();
};
/* Read whatever is currently typed in the rounds editor back into the data,
   so adding/removing a line doesn't wipe the others on re-render. */
function harvestRounds(id) {
  const s = (data.schools || []).find(x => x.id === id);
  const box = $('#rounds-' + id);
  if (!s || !box) return s;
  s.rounds = Array.from(box.querySelectorAll('.rline')).map(row => {
    const sel = row.querySelector('.rwin');
    return {
      label: row.querySelector('.rlab').value.trim(),
      date:  row.querySelector('.rdate').value || null,
      win:   sel && sel.value ? sel.value : null,
    };
  }).filter(r => r.label || r.date);
  return s;
}

window.__addRound = (id) => {
  harvestIntakes(id);
  const s = harvestRounds(id);
  if (!s) return;
  s.rounds.push({ label: 'R' + (s.rounds.length + 1), date: null });
  renderSchools();
};

window.__delRound = (id, i) => {
  harvestIntakes(id);
  const s = harvestRounds(id);
  if (!s || !s.rounds[i]) return;
  s.rounds.splice(i, 1);
  renderSchools();
};

/* Start windows — same harvest pattern as rounds, so adding or removing a
   line keeps whatever is typed in the others. Empty rows are kept here so
   the ✕ buttons' indexes stay aligned with the data; they are dropped on
   Save instead. */
function harvestIntakes(id) {
  const s = (data.schools || []).find(x => x.id === id);
  const box = $('#intakes-' + id);
  if (!s || !box) return s;
  s.intakes = Array.from(box.querySelectorAll('.iline')).map((row, i) => {
    const num = (sel) => {
      const v = parseFloat(row.querySelector(sel).value);
      return isFinite(v) && v >= 0 ? v : null;
    };
    const days = num('.idays');
    const where = row.querySelector('.iwhere').value.trim();
    // A blank trips box on a window that has days is a full-time programme,
    // not a missing figure — that is how MIT Sloan is expressed. With no
    // days either, there is simply nothing recorded, so keep the note from
    // the previous cadence rather than inventing an empty one.
    const prev = (s.intakes || [])[i] || {};
    return {
      label: row.querySelector('.ilab').value.trim(),
      on: row.querySelector('.ion').checked,
      deadline: row.querySelector('.idate').value || null,
      cadence: (days == null && !where)
        ? null
        : { trips: num('.itrips'), days, where, note: prev.cadence?.note || '' },
    };
  });
  return s;
}

window.__addIntake = (id) => {
  harvestRounds(id);
  const s = harvestIntakes(id);
  if (!s) return;
  s.intakes = s.intakes || [];
  s.intakes.push({ label: '', on: true });
  renderSchools();
};

window.__delIntake = (id, i) => {
  harvestRounds(id);
  const s = harvestIntakes(id);
  if (!s || !s.intakes[i]) return;
  s.intakes.splice(i, 1);
  renderSchools();
};

window.__saveDL = (id) => {
  const s = harvestRounds(id);
  if (!s) return;
  harvestIntakes(id);
  s.intakes = (s.intakes || []).filter(i => i.label);   // empty rows drop on save
  const durEl = $('#dl-dur-' + id);
  if (durEl) s.duration = durEl.value.trim();
  // Keep the legacy start string in step with the active windows.
  const activeStarts = (s.intakes || []).filter(i => i.on).map(i => i.label);
  if (activeStarts.length) s.start = activeStarts.join(' / ');
  const dateVal = $('#dl-date-' + id).value;
  const confirmed = $('#dl-conf-' + id).checked;
  const feeVal = parseFloat($('#dl-fee-' + id).value);
  s.appFeeUsd = isFinite(feeVal) && feeVal >= 0 ? feeVal : null;
  const urlEl = $('#dl-url-' + id);
  if (urlEl) s.url = urlEl.value.trim();
  // Ranks. Blank clears back to unranked, which sorts last rather than 0th.
  const ctryEl = $('#dl-ctry-' + id);
  if (ctryEl) s.country = ctryEl.value.trim();
  const rankVal = (el) => {
    const v = parseInt(el.value, 10);
    return isFinite(v) && v > 0 ? v : null;
  };
  s.rank = s.rank || {};
  [['global', 'rg'], ['country', 'rc'], ['europe', 're'], ['joint', 'rj']].forEach(([key, pfx]) => {
    const el = $(`#dl-${pfx}-${id}`);
    if (el) s.rank[key] = rankVal(el);
  });
  // Scholarship money often closes on its own date. Carrying it on the
  // scholarship task is what puts it in the runway and the reminders.
  const schEl = $('#dl-sch-' + id);
  if (schEl) {
    s.schDeadline = schEl.value || null;
    const schTask = (s.tasks || []).find(t => t.id === 'scholarship');
    if (schTask) schTask.due = s.schDeadline;
  }
  if (dateVal) s.deadline = dateVal;
  s.estimated = !confirmed;
  delete s.rolledFrom;               // an explicit edit resets the missed-round note
  // If rounds or window deadlines are set, the next upcoming one becomes the
  // tracked deadline — one source of truth for the runway, the calendar and
  // the submit task.
  const up = deadlineCandidates(s).find(r => daysTo(r.date) >= 0);
  if (up) {
    s.deadline = up.date;
    if (up.label) s.deadlineNote = up.label;
  }
  const submitTask = (s.tasks || []).find(t => t.id === 'submit');
  if (submitTask && s.deadline) submitTask.due = s.deadline;
  editingDL.delete(id);
  render();
  save();
  toast(up ? `Tracking ${up.label || 'next round'} — ${fmtDate(up.date)}` : 'Deadline updated');
};

/* One tap from the school card once you have verified a date with the
   admissions office — no need to open the editor just to clear the ~. */
window.__confirmDL = (id) => {
  const s = (data.schools || []).find(x => x.id === id);
  if (!s) return;
  s.estimated = false;
  render();
  save();
  toast(`${s.name} — deadline confirmed`);
};

/* ---------------- Application status ----------------
   Where each application actually stands. Task ticks measure preparation;
   this measures the application itself, which is the thing you want to see
   once schools start replying. Kept in step with the 'submit' task in both
   directions so the two can never disagree. */
const APP_FLOW  = ['none', 'drafting', 'submitted', 'interview', 'offer', 'accepted', 'rejected'];
const APP_LABEL = {
  none: 'not started', drafting: 'drafting', submitted: 'submitted',
  interview: 'interview', offer: 'offer', accepted: 'accepted', rejected: 'rejected',
};
/* Sent — the application is with the school, so its deadline has stopped
   being something to count down to. */
const APP_SENT = ['submitted', 'interview', 'offer', 'accepted', 'rejected'];

function appStatus(s) { return s.status || 'none'; }
function isSent(s)    { return APP_SENT.includes(appStatus(s)); }
function isClosed(s)  { return appStatus(s) === 'accepted' || appStatus(s) === 'rejected'; }

window.__setStatus = (sid, val) => {
  const s = (data.schools || []).find(x => x.id === sid);
  if (!s) return;
  s.status = val;
  // Ticking through to 'submitted' or beyond implies the submit task is done.
  const submitTask = (s.tasks || []).find(t => t.id === 'submit');
  if (submitTask) submitTask.done = isSent(s);
  render();
  save();
  toast(`${s.name} — ${APP_LABEL[val]}`);
};

/* ---------------- Documents ----------------
   Essays and anything else a school wants in writing. The link points at
   wherever the draft actually lives; this tracks its state, not its text. */
const DOC_STATES = ['todo', 'draft', 'review', 'final'];
const DOC_LABELS = { todo: 'to write', draft: 'draft', review: 'review', final: 'final' };

window.__addDoc = (sid) => {
  const s = (data.schools || []).find(x => x.id === sid);
  if (!s) return;
  const name = prompt('Document name (e.g. "Essay 1 — leadership"):');
  if (!name || !name.trim()) return;
  s.docs = s.docs || [];
  s.docs.push({ id: 'doc-' + Date.now(), name: name.trim(), prompt: '', words: null, status: 'todo', link: '' });
  render();
  save();
};

window.__docStatus = (sid, did) => {
  const s = (data.schools || []).find(x => x.id === sid);
  const dc = s && (s.docs || []).find(x => x.id === did);
  if (!dc) return;
  dc.status = DOC_STATES[(DOC_STATES.indexOf(dc.status) + 1) % DOC_STATES.length];
  render();
  save();
};

window.__docEdit = (sid, did) => {
  const s = (data.schools || []).find(x => x.id === sid);
  const dc = s && (s.docs || []).find(x => x.id === did);
  if (!dc) return;
  const p = prompt('Essay prompt / what the school asks for:', dc.prompt || '');
  if (p === null) return;
  const w = prompt('Word limit (blank for none):', dc.words ?? '');
  if (w === null) return;
  const l = prompt('Link to the draft (Google Doc, etc.):', dc.link || '');
  if (l === null) return;
  const wn = parseInt(w, 10);
  dc.prompt = p.trim();
  dc.words = isFinite(wn) && wn > 0 ? wn : null;
  dc.link = l.trim();
  render();
  save();

window.__delDoc = (sid, did) => {
  const s = (data.schools || []).find(x => x.id === sid);
  if (!s || !confirm('Remove this document?')) return;
  s.docs = (s.docs || []).filter(x => x.id !== did);
  render();
  save();
};

function docRow(sid, dc) {
  const bits = [];
  if (dc.words) bits.push(dc.words + ' words');
  if (dc.prompt) bits.push(esc(dc.prompt.length > 60 ? dc.prompt.slice(0, 60) + '…' : dc.prompt));
  return `
    <div class="recrow">
      <div class="recname">${esc(dc.name)}
        <div class="recmeta">${bits.join(' · ') || 'no prompt yet'}
          <a class="chase" role="button" tabindex="0" onclick="__docEdit('${sid}','${dc.id}')">edit</a>
          ${dc.link ? `<a class="chase" href="${esc(dc.link)}" target="_blank" rel="noopener noreferrer">open ↗</a>` : ''}
        </div>
      </div>
      <button class="recst dst-${dc.status}" title="Tap to move to the next stage"
              onclick="__docStatus('${sid}','${dc.id}')">${DOC_LABELS[dc.status]}</button>
      <button class="tdel" title="Remove document" aria-label="Remove ${esc(dc.name)}"
              onclick="__delDoc('${sid}','${dc.id}')">✕</button>

}

/* ---------------- Tabs ---------------- */
/* The Ask composer is fixed to the viewport rather than living inside its
   panel, so switching tabs has to show and hide it by hand — and the page
   needs extra bottom padding underneath it while it is up, or the last
   answer sits behind it. */
function goTab(name) {
  $$('.tab').forEach(t => t.classList.toggle('on', t.dataset.p === name));
  $$('.panel').forEach(p => p.classList.toggle('on', p.id === 'p-' + name));
  const asking = name === 'ask';
  $('#aifoot').hidden = !asking;

    asking ? 'calc(178px + env(safe-area-inset-bottom))' : '';
  if (asking) { $('#aictx').checked = !!(data && data.ai && data.ai.useContext); renderChat(); aiSyncModelLine(); }
  window.scrollTo({ top: 0 });
}
window.__go = goTab;
$$('.tab').forEach(tab => tab.addEventListener('click', () => goTab(tab.dataset.p)));

/* Keep cards open across re-renders */
const openSet = new Set();
window.__card = (id, el) => {
  const card = el.closest('.card');
  card.classList.toggle('open');
  card.classList.contains('open') ? openSet.add(id) : openSet.delete(id);

/* ---------------- Render helpers ---------------- */
function taskRow(scope, containerId, t) {
  const n = daysTo(t.due);
  const cls = t.done ? '' : dueClass(n);
  return `
    <div class="task ${t.done ? 'done' : ''}">
      <button class="cb ${t.done ? 'on' : ''}"
              aria-label="${t.done ? 'Mark not done' : 'Mark done'}: ${esc(t.label)}"
              onclick="__toggle('${scope}','${containerId}','${t.id}')"></button>
      <div class="tlabel">${esc(t.label)}</div>
      ${t.due ? `<div class="tdue ${cls}">${dueText(n)}</div>` : ''}
      ${t.custom ? `<button class="tdel" title="Delete task" aria-label="Delete: ${esc(t.label)}" onclick="__delTask('${scope}','${containerId}','${t.id}')">✕</button>` : ''}
    </div>`;
}

/* An SVG progress ring. Dash-offset rather than a conic gradient because
   this has to animate, and only the offset is cheap to transition. */
function ringSvg(p, size, stroke, color) {
  const r = (size - stroke) / 2;
  const c = 2 * Math.PI * r;
  const off = c * (1 - Math.max(0, Math.min(1, p / 100)));
  return `<svg viewBox="0 0 ${size} ${size}" aria-hidden="true">
    <circle class="track" cx="${size/2}" cy="${size/2}" r="${r}" stroke-width="${stroke}"/>
    <circle class="arc" cx="${size/2}" cy="${size/2}" r="${r}" stroke-width="${stroke}"
            stroke="${color}" stroke-dasharray="${c.toFixed(2)}" stroke-dashoffset="${off.toFixed(2)}"/>
  </svg>`;
}

/* One segment per task: green done, red overdue, amber inside a fortnight.
   Seven of these say what a percentage cannot — which tasks, and how bad. */
function dotBar(tasks) {
  return `<div class="dotbar">${(tasks || []).slice(0, 8).map(t => {
    const n = daysTo(t.due);
    const cls = t.done ? 'done' : (n !== null && n < 0) ? 'over' : (n !== null && n <= 14) ? 'soon' : '';
    return `<span class="${cls}"></span>`;
  }).join('')}</div>`;
}

/* Card titles have room for about two words. "Cambridge Judge EMBA" is
   three, and the third one is the same on half the list. */
function shortName(name) {
  return String(name).replace(/ (EMBA|GEMBA|Global EMBA|Executive MBA)$/, '').trim() || name;
}

/* ---------------- Calendar load ----------------
   How often the programme actually pulls you out of the country. It sits
   on the start window rather than the school because that is where it
   differs — LBS September is a fortnightly London commute, LBS January
   is half the campus days for the same degree. A ranking will never tell
   you that, and it is usually the thing that decides whether a programme
   is possible at all. */

/* The cadence that applies if you go. If you are already tracking a
   specific window, that one. Otherwise the lightest of the windows still
   switched on — the question at shortlisting time is "what is the best
   this school can do for my calendar", and picking the gentler intake is
   a real answer. Nothing is hidden by this: where two windows differ the
   Facts pane lists both side by side. */
function cadenceOf(s) {
  const on = (s.intakes || []).filter((i) => i.on && i.cadence && i.cadence.days != null);
  const tracked = on.find((i) => i.deadline && i.deadline === s.deadline);
  if (tracked) return tracked.cadence;
  if (!on.length) return ((s.intakes || [])[0] || {}).cadence || null;
  return on.slice().sort((a, b) =>
    (a.cadence.trips ?? Infinity) - (b.cadence.trips ?? Infinity))[0].cadence;
}

/* True when the school offers a genuine choice of calendar, not just a
   choice of start date. */
function cadenceVaries(s) {
  const t = (s.intakes || [])
    .filter((i) => i.cadence && i.cadence.days != null)
    .map((i) => i.cadence.trips);
  return new Set(t).size > 1;
}

/* Trips per month is the honest unit, but nobody thinks in decimals. */
function tripPhrase(t) {
  if (t == null) return 'full-time — relocate';
  if (t >= 1.75) return '2 trips a month';
  if (t >= 1.25) return '1–2 trips a month';
  if (t >= 0.85) return 'about monthly';
  if (t >= 0.6)  return 'every 6 weeks';
  return `every ${Math.round(1 / t)} months`;
}

function travelText(c) {
  if (!c || c.days == null) return '—';
  return c.trips == null
    ? `Full-time · ${c.days} days`
    : `${tripPhrase(c.trips)} · ${c.days} days out`;
}

/* Lighter sorts first. A full-time programme is not a heavier commute,
   it is a different kind of decision, so it goes last rather than
   pretending to sit on the same scale. */
function travelLoad(s) {
  const c = cadenceOf(s);
  if (!c || c.days == null) return UNRANKED;
  if (c.trips == null) return UNRANKED - 1;
  return c.trips * 1000 + (c.days || 0);
}

/* Green when the calendar is genuinely light, amber for a monthly-ish
   commitment, red once it is a fortnightly flight or a relocation. */
function travelClass(c) {
  if (!c || c.days == null) return 'dim';
  if (c.trips == null) return 'red';
  if (c.trips >= 1.5) return 'red';
  if (c.trips >= 0.85) return 'amber';
  return 'green';
}

/* ---------------- Home ---------------- */
/* Display-only state — none of this syncs; it is how you are looking at the
   data on this device right now, not the data itself.

   Home doubles as the confirm-dates screen. It is a sub-view rather than a
   seventh tab: you arrive from the amber row and leave once it is empty. */
let homeView = 'home';
window.__homeView = (v) => { homeView = v; renderDash(); window.scrollTo({ top: 0 }); };

/* Home is a set of jumping-off points, so it needs to be able to land you
   somewhere with the right thing already open. */
window.__goPlanActions = () => { planTab = 'actions'; renderPlan(); goTab('plan'); };
window.__openSchool = (id) => {
  openSet.add(id);
  schoolSort = 'deadline';
  renderSchools();
  goTab('schools');
  // Let the panel paint before measuring where the card ended up.
  requestAnimationFrame(() => {
    const el = document.querySelector(`#p-schools [data-card="${id}"]`);
    if (el) el.scrollIntoView({ block: 'start', behavior: 'smooth' });
  });
};

function renderDash() {
  const schools = activeSchools();
  const steps   = data.steps   || [];
  const actions = data.actions || [];

  // Once an application is with the school its deadline stops being a
  // countdown, so it drops out of the runway hero.
  const live = schools
    .map(s => ({ s, n: daysTo(s.deadline) }))
    .filter(x => x.n !== null && !isSent(x.s))
    .sort((a, b) => a.n - b.n);
  const next = live[0];

  const allTasks = [
    ...schools.flatMap(s => s.tasks || []),
    ...steps.flatMap(s => s.tasks || []),
    ...actions
  ];
  const doneCount = allTasks.filter(t => t.done).length;
  const overall = allTasks.length ? Math.round(doneCount / allTasks.length * 100) : 0;

  const submitted = schools.filter(isSent).length;

  // Due in next 14 days, not done
  const soon = [];
  schools.forEach(s => (s.tasks || []).forEach(t => {
    const n = daysTo(t.due);
    if (!t.done && n !== null && n <= 14) soon.push({ n, label: t.label, ctx: shortName(s.name), sid: s.id, scope:'schools', cid:s.id, t });
  }));
  steps.forEach(s => (s.tasks || []).forEach(t => {
    const n = daysTo(t.due);
    if (!t.done && n !== null && n <= 14) soon.push({ n, label: t.label, ctx: 'Step ' + s.num, scope:'steps', cid:s.id, t });
  }));
  actions.forEach(t => {
    const n = daysTo(t.due);
    if (!t.done && n !== null && n <= 14) soon.push({ n, label: t.label, ctx: 'My actions', scope:'actions', cid:'', t });
  });
  soon.sort((a, b) => a.n - b.n);

  const heroDays = next ? next.n : null;

  // Dates still to check with an admissions office — the burn-down that
  // turns the old amber paragraph into something you can work through.
  const unconfirmed = schools.filter(s => s.estimated && !isSent(s))
    .sort((a, b) => (daysTo(a.deadline) ?? 1e9) - (daysTo(b.deadline) ?? 1e9));

  const heroColor = heroDays === null ? 'var(--muted)'
    : heroDays <= 14 ? 'var(--red)' : heroDays <= 45 ? 'var(--amber)' : 'var(--accent)';
  const heroTxt = heroDays === null ? '' : heroDays <= 14 ? 'color:var(--red)'
    : heroDays <= 45 ? 'color:var(--amber)' : '';

  /* ---- Confirm dates: the amber warning as a screen you can finish ---- */
  if (homeView === 'verify') {
    $('#p-dash').innerHTML = `
      <button class="backlink" onclick="__homeView('home')">← HOME</button>
      <div class="sechead"><h2>Confirm dates</h2></div>
      <p style="font-size:13.5px;color:var(--muted);margin:0 0 16px;line-height:1.55">
        ${unconfirmed.length} of ${schools.length} deadlines are still estimates and could be
        wrong by weeks. Ring the school, then tap the tick.
      </p>
      ${unconfirmed.length ? unconfirmed.map(s => `
        <div class="trow" style="border-left-color:var(--amber)">
          <img class="logo" data-logo="${s.id}" alt="">
          <div class="mid">
            <div class="lab">${esc(shortName(s.name))}</div>
            <div class="ctx">~${fmtDate(s.deadline)}${s.url
              ? ` · <a class="chase" href="${esc(s.url)}" target="_blank" rel="noopener noreferrer">admissions page ↗</a>` : ''}</div>
          </div>
          <button class="cb" title="Mark this date as verified"
                  aria-label="Confirm the deadline for ${esc(s.name)}"
                  onclick="__confirmDL('${s.id}')"></button>
        </div>`).join('')
      : `<div class="empty" style="border-color:var(--green);color:var(--green)">Every date confirmed. Nice.</div>`}`;
    hydrateLogos($('#p-dash'));
    return;
  }

  $('#p-dash').innerHTML = `
    <div class="hero2">
      <div class="ringwrap">
        ${ringSvg(next ? Math.max(4, 100 - Math.min(100, (heroDays / 180) * 100)) : 0, 104, 7, heroColor)}
        <div class="ringmid">
          <div class="n" style="${heroTxt}">${next ? Math.abs(heroDays) : '—'}</div>
          <div class="u">DAYS</div>
        </div>
      </div>
      <div class="who">
        <div class="eyebrow">NEXT DEADLINE</div>
        <div class="nm">${next
          ? `<img class="logo" data-logo="${next.s.id}" alt="" style="width:26px;height:26px;border-radius:6px;flex-shrink:0">${esc(shortName(next.s.name))}`
          : 'Nothing outstanding'}</div>
        ${next ? `<div class="dt">${next.s.estimated ? '~' : ''}${fmtDate(next.s.deadline)} · ${esc(next.s.priority)}</div>` : ''}
      </div>
    </div>

    <div class="pulse">
      <div class="pbox"><div class="v">${overall}%</div><div class="k">DONE</div></div>
      <div class="pbox"><div class="v">${submitted}/${schools.length}</div><div class="k">SENT</div></div>
      <div class="pbox"><div class="v" style="${soon.length ? 'color:var(--red)' : ''}">${soon.length}</div><div class="k">DUE 14D</div></div>
    </div>

    <div class="sechead"><h2>Today</h2><span class="c">${soon.length
      ? `next ${Math.min(4, soon.length)} of ${soon.length} due` : 'nothing due'}</span></div>
    ${soon.length ? soon.slice(0, 4).map(x => `
      <div class="trow ${x.n < 0 ? 'over' : x.n <= 7 ? 'week' : ''}">
        <button class="cb" aria-label="Mark done: ${esc(x.label)}"
                onclick="__toggle('${x.scope}','${x.cid}','${x.t.id}')"></button>
        <div class="mid">
          <div class="lab">${esc(x.label)}</div>
          <div class="ctx">${x.sid ? `<img class="logo" data-logo="${x.sid}" alt="">` : ''}${esc(x.ctx)}</div>
        </div>
        <div class="d ${dueClass(x.n)}">${dueText(x.n)}</div>
      </div>`).join('')
    : `<div class="empty">Clear this fortnight. Good time to get ahead on essays.</div>`}
    <button class="seeall" onclick="__goPlanActions()">SEE ALL ${allTasks.length - doneCount} OPEN TASKS →</button>

    <div class="sechead"><h2>Runway</h2><span class="c">swipe · ${schools.length} schools</span></div>
    <div class="runway">
      ${live.slice(0, 8).map(x => {
        const nt = (x.s.tasks || []).find(t => !t.done);
        return `

          <div class="pg">${pct(x.s.tasks)}% DONE</div>
          <div class="rwnext ${nt ? '' : 'clear'}">
            <span class="car">▸</span>
            <span class="tx">${nt ? esc(nt.label) : 'all tasks ticked'}</span>

      }).join('')}
    </div>

    ${unconfirmed.length ? `
      <button class="verifyrow" onclick="__homeView('verify')">
        <div class="n">${unconfirmed.length}</div>
        <div class="t">dates still unconfirmed
          <div class="s">estimates — ring admissions, then tap to confirm</div>

  hydrateLogos($('#p-dash'));

/* ---------------- School logos ----------------
   A school's logo comes from one of two places, in this order:

     1. data.logos[id] — an image you picked in Settings. Held as a data
        URL, so it lives in your backup and syncs to your other devices
        like any other field.
     2. ./logos/<school id>.<ext> — a file sitting in the logos folder.
        Every common format is tried in turn, so naming the file
        oxford-said.png works exactly as well as oxford-said.svg.

   Missing both lands on the grey _fallback.svg badge.

   A browser cannot list a directory, which is why step 2 is a probe:
   ask for each extension and keep whichever one loads. The answer is
   cached per session, so the misses only ever happen once per school.
-------------------------------------------------- */
const LOGO_EXTS = ['svg', 'png', 'webp', 'jpg', 'jpeg', 'avif', 'gif'];
const LOGO_FALLBACK = 'logos/_fallback.svg';
const logoFound = {};   // school id -> the folder url that actually loaded

function attachLogo(img, id) {
  const picked = data && data.logos ? data.logos[id] : null;
  if (picked) { img.src = picked; return; }
  if (logoFound[id]) { img.src = logoFound[id]; return; }

  let i = 0;
  const next = () => {
    if (i >= LOGO_EXTS.length) {
      img.onerror = img.onload = null;
      img.src = LOGO_FALLBACK;
      return;
    }
    const url = 'logos/' + id + '.' + LOGO_EXTS[i++];
    img.onerror = next;
    img.onload = () => { img.onerror = img.onload = null; logoFound[id] = url; };
    img.src = url;
  };
  next();
}

function hydrateLogos(root) {
  (root || document).querySelectorAll('img[data-logo]')
    .forEach((img) => attachLogo(img, img.dataset.logo));
}

/* Where a school's logo is currently coming from, for the Settings list. */
function logoOrigin(id) {
  if (data && data.logos && data.logos[id]) return 'picked on a device';
  if (logoFound[id]) return logoFound[id];
  return 'logos/' + id + '.*';
}

/* Anything you pick is redrawn onto a 128x128 canvas before it is stored.
   A phone photo is a couple of megabytes and the whole sync document has a
   1 MB ceiling, so keeping the original would break sync the first time you
   used this. 128px is four times the size the badge is ever drawn at. */
const LOGO_PX = 128;
const LOGO_MAX_CHARS = 120000;     // ~88 KB for any single logo

/* The sync document holds ALL your data and Firestore caps it at 1 MB. The
   tracker itself is about 25 KB, so the logos have to stay well under that
   ceiling — 18 detailed images could otherwise add up to more than a
   megabyte and silently break sync for every device at once. */
const LOGO_BUDGET_CHARS = 600000;  // ~440 KB of logos in total

function logoBytesExcept(skipId) {
  const all = (data && data.logos) || {};
  return Object.keys(all).reduce(
    (n, k) => (k === skipId ? n : n + all[k].length), 0);
}

function readLogoFile(file) {
  return new Promise((resolve, reject) => {
    if (!file.type || !file.type.startsWith('image/')) {
      reject(new Error('not an image')); return;
    }
    const fr = new FileReader();
    fr.onerror = () => reject(new Error('unreadable'));
    fr.onload = () => {
      // A small SVG is already tiny and resolution-independent, so keep it
      // as it is rather than flattening it to pixels. A big one goes
      // through the canvas like everything else.
      if (file.type === 'image/svg+xml' && file.size <= 64 * 1024) {
        resolve(fr.result); return;
      }
      const img = new Image();
      img.onerror = () => reject(new Error('undecodable'));
      img.onload = () => {
        try {
          const c = document.createElement('canvas');
          c.width = c.height = LOGO_PX;
          const ctx = c.getContext('2d');
          const scale = Math.min(LOGO_PX / img.width, LOGO_PX / img.height) || 1;
          const w = img.width * scale, h = img.height * scale;
          ctx.drawImage(img, (LOGO_PX - w) / 2, (LOGO_PX - h) / 2, w, h);
          resolve(c.toDataURL('image/png'));
        } catch (e) { reject(e); }
      };
      img.src = fr.result;
    };
    fr.readAsDataURL(file);
  });
}

let logoTarget = null;

window.__pickLogo = (id) => {
  logoTarget = id;
  const inp = $('#logoFile');
  inp.value = '';          // so re-picking the same file still fires change
  inp.click();
};

/* Switch a school in or out of the tracker. The settings list is long, so
   hold the scroll position — re-rendering would otherwise throw you back to
   the top every time you flick a switch. */
window.__toggleSchool = (id) => {
  const y = window.scrollY;
  data.excluded = data.excluded || {};
  if (data.excluded[id]) delete data.excluded[id];
  else data.excluded[id] = true;
  save();
  render();
  window.scrollTo({ top: y });
  const s = (data.schools || []).find((x) => x.id === id);
  const name = s ? s.name : 'School';
  toast(isExcluded(id) ? `${name} switched off` : `${name} switched back on`);
};

window.__clearLogo = (id) => {
  if (!data.logos || !data.logos[id]) return;
  delete data.logos[id];
  save();
  render();
  toast('Back to the logos folder for this school');
};

/* The rate field is rebuilt on every render, so listen at the document
   level rather than binding to an element that keeps being replaced.
   'change' (not 'input') means this fires when you finish typing, not on
   every keystroke — re-rendering mid-keystroke would steal the caret. */
document.addEventListener('change', (e) => {
  if (!e.target || e.target.id !== 'fxRate') return;
  const v = parseFloat(e.target.value);
  data.fx = data.fx || {};
  data.fx.ngnPerUsd = isFinite(v) && v > 0 ? v : null;
  save();
  render();
  toast(data.fx.ngnPerUsd
    ? `Rate set — ₦${data.fx.ngnPerUsd.toLocaleString('en-GB')} to $1`
    : 'Naira conversion off');
});

$('#logoFile').addEventListener('change', async (e) => {
  const file = e.target.files && e.target.files[0];
  const id = logoTarget;
  logoTarget = null;
  if (!file || !id) return;
  try {
    const url = await readLogoFile(file);
    if (url.length > LOGO_MAX_CHARS) {
      toast('That image is still too large after resizing');
      return;
    }
    if (logoBytesExcept(id) + url.length > LOGO_BUDGET_CHARS) {
      toast('No room left for more picked logos — reset one first');
      return;
    }
    data.logos = data.logos || {};
    data.logos[id] = url;
    save();
    render();
    toast('Logo updated');
  } catch (err) {
    console.error('Logo import failed', err);
    toast('Could not read that file as an image');
  }
});

/* ---------------- Schools ---------------- */
/* Task filter — display-only state, like homeView above. With ~150 tasks
   across 18 cards, scrolling stopped being a search strategy. */
let taskQ = '';                       // free-text match on task labels
let taskMode = 'all';                 // all | open | overdue
window.__setTaskMode = (m) => { taskMode = m; renderSchools(); };

function taskMatches(t) {
  if (taskMode === 'open' && t.done) return false;
  if (taskMode === 'overdue') {
    const n = daysTo(t.due);
    if (t.done || n === null || n >= 0) return false;
  }
  if (taskQ && !t.label.toLowerCase().includes(taskQ.toLowerCase())) return false;
  return true;
}

/* Re-rendering on every keystroke would steal the caret, so the search box
   waits for a pause in typing, then re-renders and puts the caret back. */
let taskQTimer = null;
document.addEventListener('input', (e) => {
  if (!e.target || e.target.id !== 'taskQ') return;
  taskQ = e.target.value;
  clearTimeout(taskQTimer);
  taskQTimer = setTimeout(() => {
    renderSchools();
    const el = $('#taskQ');
    if (el) { el.focus(); el.setSelectionRange(el.value.length, el.value.length); }
  }, 300);
});
window.__clearTaskQ = () => { taskQ = ''; renderSchools(); };

/* Start windows for display — active ones plain, switched-off ones struck
   through so the second window is never silently lost. */
function startHtml(s) {
  const iw = s.intakes || [];
  if (!iw.length) return esc(s.start || '—');
  return iw.map(i => {
    const txt = esc(i.label)
      + (i.deadline ? ` <span class="c">(apply by ${fmtDate(i.deadline)})</span>` : '');
    return i.on ? txt : `<s style="opacity:.55" title="switched off">${txt}</s>`;
  }).join(' / ');
}

/* ---------------- QS Executive MBA ranks ----------------
   Three cuts of the same 2026 ranking: the global table, the position
   within the school's own country, and the position within Europe. Any of
   them can be blank — QS does not rank every programme, and the ones this
   app could not read are left for you to fill in rather than guessed at. */

/* Unranked sorts last rather than first. 1e9 not Infinity, because
   Infinity - Infinity is NaN and a NaN comparator scrambles the list. */
const UNRANKED = 1e9;
function rankOf(s, k) {
  const v = s.rank && s.rank[k];
  return v == null ? UNRANKED : v;
}
function byRank(k) {
  return (a, b) => (rankOf(a, k) - rankOf(b, k)) || a.name.localeCompare(b.name);
}

/* How much weight a school's dates can bear. Green means the school said
   so this cycle; anything else means you are planning on an inference. */
const ADMISSIONS_LABEL = {
  'published':  "the school's 2027 calendar",
  'prior-year': "last year's calendar, +1 year",
  'rolling':    'rolling — no fixed deadline',
  'unknown':    'not established',
};
const ADMISSIONS_CLASS = {
  'published': 'green', 'prior-year': 'amber', 'rolling': 'amber', 'unknown': 'dim',
};

const PRIORITY_ORDER = { URGENT: 0, HIGH: 1, AMBER: 2, STANDARD: 3 };
const byDeadline = (a, b) => (daysTo(a.deadline) ?? UNRANKED) - (daysTo(b.deadline) ?? UNRANKED);

const SORTS = {
  default:  { label: 'Priority',      fn: (a, b) => (PRIORITY_ORDER[a.priority] - PRIORITY_ORDER[b.priority]) || byDeadline(a, b) },
  deadline: { label: 'Deadline',      fn: byDeadline },
  global:   { label: 'QS global',     fn: byRank('global') },
  country:  { label: 'QS in country', fn: byRank('country') },
  europe:   { label: 'QS in Europe',  fn: byRank('europe') },
  cost:     { label: 'All-in cost',   fn: (a, b) => (a.totalUsd || 0) - (b.totalUsd || 0) },
  travel:   { label: 'Travel load',   fn: (a, b) => travelLoad(a) - travelLoad(b) },
};

let schoolSort = 'default';
window.__setSort = (v) => { schoolSort = SORTS[v] ? v : 'default'; renderSchools(); };

/* Full rank line for the card body. */
function rankHtml(s) {
  const r = s.rank || {};
  const bits = [];
  if (r.global != null) bits.push(`<b>#${r.global}</b> global`);
  if (r.joint  != null) bits.push(`<b>#${r.joint}</b> joint programmes`);
  if (r.country != null) bits.push(`<b>#${r.country}</b> ${esc(s.country || 'country')}`);
  if (r.europe != null) bits.push(`<b>#${r.europe}</b> Europe`);
  return bits.length
    ? bits.join(' · ')
    : '<span class="c">not ranked here yet — add it under edit</span>';
}

/* Short badge for the collapsed card. Joint programmes are ranked in their
   own QS table, so say so rather than implying a global position. */
function rankPill(s) {
  const r = s.rank || {};
  if (r.global != null) return `<span class="pill qsp">QS #${r.global}</span>`;
  if (r.joint  != null) return `<span class="pill qsp">QS #${r.joint} joint</span>`;
  return '';
}

/* Which pane a school card is showing. Display-only, like openSet — it is

                            <input type="number" class="idays" min="0" step="1" value="${iw.cadence?.days ?? ''}" placeholder="days out" aria-label="Days out of office for ${esc(iw.label || '')}">

                      </div>
                      <button class="editlink" onclick="__addIntake('${s.id}')">+ add start window</button>
                      <div id="rounds-${s.id}" style="flex-basis:100%">
                        ${rs.length ? '' : `<div class="recmeta" style="margin:2px 0 4px">Rounds: add each round's date and the tracker follows the next open one automatically.</div>`}
                        ${(s.rounds || []).map((rr, i) => `
                          <div class="rline">
                            <input type="text" class="rlab" value="${esc(rr.label || '')}" placeholder="R${i + 1}" aria-label="Round name">
                            <input type="date" class="rdate" value="${rr.date || ''}" aria-label="Round date">
                            ${(s.intakes || []).length > 1 ? `
                              <select class="rwin" aria-label="Start window this round feeds">
                                <option value="">all windows</option>
                                ${(s.intakes || []).filter(iw => iw.label).map(iw =>
                                  `<option value="${esc(iw.label)}" ${rr.win === iw.label ? 'selected' : ''}>${esc(iw.label)}</option>`).join('')}

                      </div>
