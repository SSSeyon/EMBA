                    </div>` : ''}
                </div>
              </div>` : ''}

            ${pane === 'money' ? `
              <div class="panebody" style="padding-top:12px">
                <div class="moneytop"><div class="k">ALL-IN COST</div><div class="v">${usd(s.totalUsd)}</div></div>
                <div class="splitbar">
                  <div class="tui" style="width:${tw}%"></div><div class="liv" style="width:${100 - tw}%"></div>
                </div>
                <div class="splitkey">
                  <span><i class="swatch" style="background:var(--accent)"></i>tuition ${usd(s.tuitionUsd)}</span>
                  <span><i class="swatch" style="background:var(--blue)"></i>living + fees</span>
                </div>
                <div class="cinfo" style="margin-top:10px">
                  <b>Tuition (local):</b> ${esc(s.ccy)} ${Number(s.tuitionLocal).toLocaleString('en-GB')}${s.appFeeUsd ? ` · <b>App fee:</b> ${usd(s.appFeeUsd)}` : ''}
                </div>
                <div class="gapbox ${!funds ? '' : gap >= 0 ? 'ok' : 'short'}">
                  <div class="k">AGAINST YOUR FUNDING</div>
                  <div class="v">${!funds ? 'set your funding on the Costs tab'
                    : gap >= 0 ? `covered, ${usd(gap)} spare` : `short by ${usd(Math.abs(gap))}`}</div>
                </div>
                <div class="cinfo" style="margin-top:12px">
                  <b>Scholarship:</b> ${esc(s.scholarship)}<br>
                  <b>Apply for funding:</b> ${esc(s.scholarshipTiming)}${s.schDeadline
                    ? ` — <b>by ${fmtDate(s.schDeadline)}</b> <span class="${dueClass(schN)}">${dueText(schN)}</span>` : ''}<br>
                  <b>Waiver:</b> ${esc(s.waiverNote)}
                </div>
              </div>` : ''}

            ${pane === 'notes' ? `
              <div class="panebody" style="padding-top:12px">
                <div class="statusrow">
                  <label for="st-${s.id}">Application status</label>
                  <select id="st-${s.id}" class="stsel ap-${st}" onchange="__setStatus('${s.id}',this.value)">
                    ${APP_FLOW.map(v => `<option value="${v}" ${st === v ? 'selected' : ''}>${APP_LABEL[v]}</option>`).join('')}
                  </select>
                </div>
                <label class="noteslabel" for="notes-${s.id}">Notes</label>
                <textarea class="notes" id="notes-${s.id}" data-id="${s.id}" placeholder="Contacts, interview notes, anything worth remembering…">${esc(s.notes || '')}</textarea>
                <label class="noteslabel">Essays and documents</label>
                ${(s.docs || []).map(dc => docRow(s.id, dc)).join('')}
                <button class="ghost addtask" onclick="__addDoc('${s.id}')">+ Add document</button>
                <label class="noteslabel">Recommenders</label>
                ${(s.recs || []).map(rr => recRow(s.id, rr)).join('')}
                <button class="ghost addtask" onclick="__addRec('${s.id}')">+ Add recommender</button>
              </div>` : ''}
          </div>
        </div>`;
      }).join('')}
    </div>
    ${filtering && !matchCount ? `<div class="empty">No tasks match. Loosen the filter or clear the search.</div>` : ''}`;

  hydrateLogos($('#p-schools'));
}

/* ---------------- Plan ----------------
   Project steps and My actions were two tabs doing one job: what is left to
   do that is not a school. They share a panel now, which is what freed the
   sixth slot for Ask.

   The actions half is grouped rather than flat. A single sorted list buries
   the two things due this week under fourteen that are not, and the whole
   point of the list is the two. */
let planTab = 'steps';
window.__planTab = (k) => { planTab = k; renderPlan(); window.scrollTo({ top: 0 }); };

function renderPlan() {
  const steps = data.steps || [];
  const acts = data.actions || [];
  const stepsDone = steps.filter(s => pct(s.tasks) === 100).length;

  const byDue = (a, b) => (daysTo(a.due) ?? 1e9) - (daysTo(b.due) ?? 1e9);
  const isNow = (t) => { const n = daysTo(t.due); return n !== null && n <= 14; };
  const now   = acts.filter(t => !t.done && isNow(t)).sort(byDue);
  const later = acts.filter(t => !t.done && !isNow(t)).sort(byDue);
  const done  = acts.filter(t => t.done);

  const group = (title, items, cls, dot, fg, emptyText, tail = '') => `
    <div class="ghead">
      <span class="dot2" style="background:${dot}"></span>
      <span class="t" style="color:${fg}">${title}</span>
      <span class="rule"></span>
      <span class="c">${items.length}</span>
    </div>
    <div class="agroup ${cls}">
      ${items.length ? items.map(t => taskRow('actions', '', t)).join('')
        : `<div class="gempty">${emptyText}</div>`}
      ${tail}
    </div>`;

  $('#p-plan').innerHTML = `
    <div class="sechead"><h2>Plan</h2><span class="c">${planTab === 'steps'
      ? `${stepsDone}/${steps.length} steps done`
      : `${now.length + later.length} open`}</span></div>
    <div class="subtabs">
      <button class="subtab ${planTab === 'steps' ? 'on' : ''}" onclick="__planTab('steps')">PROJECT STEPS</button>
      <button class="subtab ${planTab === 'actions' ? 'on' : ''}" onclick="__planTab('actions')">MY ACTIONS</button>
    </div>

    ${planTab === 'steps' ? `
      <div class="grid">
        ${steps.map(s => {
          const p = pct(s.tasks);
          return `
          <div class="card ${openSet.has(s.id) ? 'open' : ''}">
            <div class="chead" onclick="__card('${s.id}',this)">
              <div class="stepring">
                ${ringSvg(p, 38, 3.5, p === 100 ? 'var(--green)' : 'var(--accent)')}
                <div class="num" style="${p === 100 ? 'color:var(--green)' : ''}">${s.num}</div>
              </div>
              <div style="min-width:0">
                <div class="cname">${esc(s.name)}</div>
                <div class="cmeta"><span class="mono">${(s.tasks||[]).filter(t=>t.done).length}/${(s.tasks||[]).length} tasks</span></div>
              </div>
              <div class="cright">
                <div class="cdays ${p === 100 ? 'ok' : ''}" style="${p === 100 ? 'color:var(--green)' : ''}">${p}%</div>
              </div>
            </div>
            <div class="cbody">
              <div class="cinfo">${esc(s.detail)}</div>
              ${(s.tasks || []).map(t => taskRow('steps', s.id, t)).join('')}
            </div>
          </div>`;
        }).join('')}
      </div>`
    : `
      ${group('DO NOW', now, 'now', 'var(--red)', 'var(--red)', 'Nothing urgent — good.')}
      ${group('LATER', later, '', 'var(--muted)', 'var(--muted)', 'Nothing queued.',
        `<button class="ghost addtask" onclick="__addTask('actions','')">+ Add task</button>`)}
      ${group('DONE', done, '', 'var(--green)', 'var(--green)', 'Nothing ticked yet.')}`}`;
}

/* ---------------- Money ---------------- */
/* Compare picker — display-only state. Up to three schools side by side. */
const cmpSet = new Set();
window.__cmp = (id) => {
  if (cmpSet.has(id)) cmpSet.delete(id);
  else if (cmpSet.size >= 3) { toast('Three schools at a time — drop one first'); return; }
  else cmpSet.add(id);
  renderMoney();
};
window.__cmpClear = () => { cmpSet.clear(); renderMoney(); };

function potsTotal() {
  const p = (data && data.pots) || {};
  const vals = ['savings', 'employer', 'scholarship', 'loan'].map(k => Number(p[k]) || 0);
  return vals.reduce((a, b) => a + b, 0);
}

/* Pot fields save on 'change' like the FX field — same document-level
   listener pattern, because the inputs are rebuilt on every render. */
document.addEventListener('change', (e) => {
  if (!e.target || !e.target.classList || !e.target.classList.contains('potIn')) return;
  const v = parseFloat(e.target.value);
  data.pots = data.pots || {};
  data.pots[e.target.dataset.pot] = isFinite(v) && v > 0 ? v : null;
  save();
  renderMoney();
});

const POT_COLORS = {
  savings: 'var(--accent)', employer: 'var(--blue)',
  scholarship: 'var(--green)', loan: 'var(--amber)',
};

function renderMoney() {
  const ranked = activeSchools().slice().sort((a, b) => a.totalUsd - b.totalUsd);
  const funding = data.funding || [];
  const pots = data.pots || {};
  const funds = potsTotal();
  const feeSchools = ranked.filter(s => s.appFeeUsd);
  const feeTotal = feeSchools.reduce((n, s) => n + s.appFeeUsd, 0);
  const cmp = ranked.filter(s => cmpSet.has(s.id));

  const POTS = [
    ['savings', 'SAVINGS'], ['employer', 'EMPLOYER'],
    ['scholarship', 'SCHOLARSHIP'], ['loan', 'LOAN'],
  ];

  // Every bar is drawn against the same scale, and the scale has to include
  // the funding line or a well-funded plan pushes the marker off the end.
  const maxCost = Math.max(1, ...ranked.map(s => s.totalUsd || 0), funds);
  const affordable = funds ? ranked.filter(s => (s.totalUsd || 0) <= funds).length : 0;

  $('#p-money').innerHTML = `
    <div class="sechead"><h2>Costs</h2><span class="c">${funds ? usd(funds) + ' available' : 'set your funding'}</span></div>

    <div class="fundcard">
      <div class="fundtop">
        <div class="k">WHAT YOU CAN RAISE</div>
        <div class="v">${funds ? usd(funds) : '$0'}</div>
      </div>
      ${funds ? `<div class="potstack">
        ${POTS.filter(([k]) => Number(pots[k]) > 0).map(([k]) =>
          `<i style="width:${Math.round(Number(pots[k]) / funds * 100)}%;background:${POT_COLORS[k]}"></i>`).join('')}
      </div>` : ''}
      <div class="pots" style="margin-top:12px">
        ${POTS.map(([k, label]) => `
          <div class="pot">
            <label for="pot-${k}"><i class="swatch" style="background:${POT_COLORS[k]};display:inline-block;margin-right:5px;vertical-align:middle"></i>${label}</label>
            <input type="number" class="potIn" id="pot-${k}" data-pot="${k}" min="0" step="any"
                   inputmode="decimal" placeholder="$0" value="${pots[k] ?? ''}" aria-label="${label} in USD">
          </div>`).join('')}
      </div>
    </div>

    <div class="sechead"><h2>Affordability</h2><span class="c">${funds ? `${affordable} within reach` : 'cheapest first'}</span></div>
    ${funds ? `<div class="affmarkrow"><div class="affmarklab" style="left:${Math.min(88, Math.max(12, Math.round(funds / maxCost * 100)))}%">${usd(funds)} YOU CAN RAISE</div></div>` : ''}
    ${ranked.map(s => {
      const on = cmpSet.has(s.id);
      const within = funds && (s.totalUsd || 0) <= funds;
      return `
      <button class="affrow ${on ? 'on' : ''}" onclick="__cmp('${s.id}')" aria-pressed="${on}">
        <div class="afftop">
          <img class="logo" data-logo="${s.id}" alt="" style="width:20px;height:20px;border-radius:5px">
          <div class="nm">${esc(shortName(s.name))}${s.flag ? ' <span style="color:var(--amber)">⚑</span>' : ''}</div>
          <div class="amt ${within ? 'ok' : ''}">${usd(s.totalUsd)}</div>
        </div>
        <div class="afftrack">
          <div class="afffill ${!funds ? '' : within ? 'ok' : 'short'}" style="width:${Math.round((s.totalUsd || 0) / maxCost * 100)}%"></div>
          ${funds ? `<div class="affmark" style="left:${Math.round(funds / maxCost * 100)}%"></div>` : ''}
        </div>
      </button>`;
    }).join('')}
    ${funds ? `<div class="affkey">
      <span><i class="swatch" style="background:var(--green)"></i>affordable</span>
      <span><i class="swatch" style="background:var(--red)"></i>past the line</span>
    </div>` : `<div class="setnote" style="padding:8px 0 0">Fill in what you could raise above and every bar turns green or red against it.</div>`}

    ${cmp.length >= 2 ? `
      <div class="sechead"><h2>Head to head</h2><button class="editlink" onclick="__cmpClear()">clear</button></div>
      <div class="tscroll"><table style="min-width:${150 * cmp.length + 120}px">
        <thead><tr><th></th>${cmp.map(s => `<th>${esc(shortName(s.name))}</th>`).join('')}</tr></thead>
        <tbody>
          ${[
            ['Deadline', s => `${fmtDate(s.deadline)}${s.estimated ? ' <span class="est">est</span>' : ''}`],
            ['Dates from', s => `<span class="${ADMISSIONS_CLASS[s.admissions] || 'dim'}">${ADMISSIONS_LABEL[s.admissions] || 'not established'}</span>`],
            ['Countdown', s => isSent(s) ? APP_LABEL[appStatus(s)] : dueText(daysTo(s.deadline))],
            ['Status', s => appStatus(s) === 'none' ? '—' : `<span class="pill ap-${appStatus(s)}">${APP_LABEL[appStatus(s)]}</span>`],
            ['QS global', s => s.rank?.global != null ? `#${s.rank.global}`
              : s.rank?.joint != null ? `#${s.rank.joint} <span class="c">joint</span>` : '—'],
            ['QS in country', s => s.rank?.country != null ? `#${s.rank.country} <span class="c">${esc(s.country || '')}</span>` : '—'],
            ['QS in Europe', s => s.rank?.europe != null ? `#${s.rank.europe}` : '—'],
            ['Priority', s => `<span class="pill p-${s.priority}">${s.priority}</span>`],
            ['Test waiver', s => `<span class="pill w-${s.waiver}">${s.waiver}</span>`],
            ['Starts', s => startHtml(s)],
            ['Duration', s => esc(s.duration || '—')],
            ['Travel', s => { const c = cadenceOf(s); return `<span class="${travelClass(c)}">${esc(travelText(c))}</span>`; }],
            ['Where', s => { const c = cadenceOf(s); return esc(c?.where || '—'); }],
            ['Tuition (local)', s => `${esc(s.ccy)} ${Number(s.tuitionLocal).toLocaleString('en-GB')}`],
            ['Tuition (USD)', s => usd(s.tuitionUsd)],
            ['All-in (USD)', s => `<b>${usd(s.totalUsd)}</b>`],
            ['App fee', s => s.appFeeUsd ? usd(s.appFeeUsd) : '—'],
            ...(funds ? [['Gap', s => { const g = funds - s.totalUsd - (s.appFeeUsd || 0); return g >= 0 ? '<span class="gap-ok">covered</span>' : `<span class="gap-short">−${usd(Math.abs(g))}</span>`; }]] : []),
            ['Progress', s => `${pct(s.tasks)}% · ${(s.tasks || []).filter(t => t.done).length}/${(s.tasks || []).length} tasks`],
            ['Scholarship deadline', s => s.schDeadline ? fmtDate(s.schDeadline) : '—'],
            ['Scholarship', s => esc(s.scholarship)],
          ].map(([label, fn]) => `<tr><td style="font-weight:600;white-space:nowrap">${label}</td>${cmp.map(s => `<td>${fn(s)}</td>`).join('')}</tr>`).join('')}
        </tbody>
      </table></div>`
    : `<div class="setnote" style="padding:12px 0 0">TAP TWO OR THREE BARS TO COMPARE THEM</div>`}

    <div class="sechead"><h2>Funding routes</h2><span class="c">${funding.length} routes</span></div>
    <div class="grid">
      ${funding.map(f => `
        <div class="card"><div class="chead" style="cursor:default;display:block;padding:12px 14px">
          <div style="display:flex;align-items:baseline;gap:8px">
            <div style="flex:1;min-width:0;font-size:14px;font-weight:600;letter-spacing:-.01em">${esc(f.name)}</div>
            <span class="pill">${esc(f.type)}</span>
          </div>
          <div style="font-size:13px;color:var(--muted);margin-top:6px;line-height:1.5">${esc(f.detail)}</div>
          <div class="mono" style="font-size:10.5px;color:var(--accent);margin-top:8px;line-height:1.5">→ ${esc(f.action)}</div>
        </div></div>`).join('')}
    </div>

    <div class="setnote" style="padding:16px 0 0">
      FX: EUR 1 ≈ USD 1.08 · GBP 1 ≈ USD 1.27 · CHF 1 ≈ USD 1.12 (late June 2026).
      ${fxRate()
        ? `Naira shown after each USD figure at ₦${Number(fxRate()).toLocaleString('en-GB')}/$1 — the rate you set under More.`
        : `Set a naira rate under <b style="color:var(--accent)">More → Exchange rate</b> to see every figure in naira as well.`}
      ⚑ marks figures needing direct verification with the school.
      ${feeSchools.length
        ? `Application fees entered so far: <b style="color:var(--paper)">${usd(feeTotal)}</b> across ${feeSchools.length} of ${ranked.length} schools; fees count towards the gap.`
        : `No application fees entered yet — each school's Facts pane has an “App fee” field under edit.`}
    </div>`;

  hydrateLogos($('#p-money'));
}

/* ================================================================
   Ask Gemini
   ----------------------------------------------------------------
   A floating button opens a chat sheet that puts a question to the
   Gemini API using one of the keys you have stored in Settings.

   SECURITY NOTE — read this before you paste a key in. Your keys are
   held on the data object, which means they ride the same sync as
   everything else and land in the shared Firestore document. That
   document is deliberately wide open (`allow read, write: if true`,
   see sync.js), so anyone who has the project ID can read the keys
   out of it. A Gemini key is a billable credential; a tracker
   deadline is not. Use a key you are willing to rotate, keep it on a
   project with a spend cap, and delete it here the moment you are
   done with it. Nothing about this is hidden from you — the warning
   is repeated on the Settings row that adds one.
   ================================================================ */

/* Tried in order, top first, until one answers. The chain exists because
   model names come and go: a name that 404s today is skipped rather than
   breaking the feature, and you still get an answer from whatever is next
   down the list. Every reply says which one actually produced it. */
const AI_MODELS = [
  { id: 'gemini-3.6-pro',        label: 'Gemini 3.6 Pro' },
  { id: 'gemini-3.6-flash',      label: 'Gemini 3.6 Flash' },
  { id: 'gemini-3-pro-preview',  label: 'Gemini 3 Pro' },
  { id: 'gemini-2.5-pro',        label: 'Gemini 2.5 Pro' },
  { id: 'gemini-2.5-flash',      label: 'Gemini 2.5 Flash' },
  { id: 'gemini-2.0-flash',      label: 'Gemini 2.0 Flash' },
];
const AI_ENDPOINT = 'https://generativelanguage.googleapis.com/v1beta/models/';
const modelLabel = (id) => AI_MODELS.find((m) => m.id === id)?.label || id;

/* ---- Keys ---- */
function aiKeys()   { return (data && data.ai && data.ai.keys) || []; }
function activeKey() {
  const ks = aiKeys();
  return ks.find((k) => k.id === (data.ai && data.ai.activeId)) || null;
}
/* Enough of the key to tell two of them apart, not enough to use. */
const maskKey = (k) => (k && k.length > 8) ? k.slice(0, 4) + '…' + k.slice(-4) : '••••';

/* ---- Chat history ----
   Deliberately NOT on the data object: it would push every message into
   the synced document, which has a 1 MB ceiling and no business holding a
   transcript. Local to this browser, capped, survives a reload. */
const AI_CHAT_KEY = 'emba-ai-chat';
const AI_CHAT_MAX = 40;
let aiChat = [];
let aiBusy = false;

function loadChat() {
  try {
    const raw = localStorage.getItem(AI_CHAT_KEY);
    aiChat = raw ? JSON.parse(raw) : [];
    if (!Array.isArray(aiChat)) aiChat = [];
  } catch (e) { aiChat = []; }
}
function saveChat() {
  aiChat = aiChat.slice(-AI_CHAT_MAX);
  try { localStorage.setItem(AI_CHAT_KEY, JSON.stringify(aiChat)); } catch (e) {}
}

/* ---- Tracker context ----
   What the model is told about your applications, so "which deadline is
   next?" has an answer. Off by unticking the box in the sheet — that
   sends the question alone and nothing about your schools. */
function aiContext() {
  const lines = ['The user is applying to Executive MBA programmes for a 2027 start.',
    `Today is ${todayISO()}.`, '', 'THEIR SHORTLIST:'];
  activeSchools()
    .slice().sort((a, b) => (daysTo(a.deadline) ?? 1e9) - (daysTo(b.deadline) ?? 1e9))
    .forEach((s) => {
      const n = daysTo(s.deadline);
      const open = (s.tasks || []).filter((t) => !t.done).length;
      const cad = cadenceOf(s);
      lines.push([
        `- ${s.name} (${s.geo || '?'})`,
        `deadline ${s.deadline || 'not set'}${n != null ? ` — ${dueText(n)}` : ''}`,
        s.deadlineNote ? `round: ${s.deadlineNote}` : null,
        `status: ${s.status || 'none'}`,
        `starts ${s.start || '?'}`,
        s.totalUsd ? `all-in about $${Number(s.totalUsd).toLocaleString('en-GB')}` : null,
        s.rank?.global != null ? `QS global #${s.rank.global}` : null,
        // The calendar is usually the binding constraint, so it goes in
        // the context rather than being something the user has to
        // re-explain in every question.
        cad ? `travel: ${travelText(cad)}${cad.where ? ` in ${cad.where}` : ''}` : null,
        cad?.note ? `format: ${cad.note}` : null,
        `${open} task${open === 1 ? '' : 's'} outstanding`,
      ].filter(Boolean).join('; '));

      // Where two windows differ, say so explicitly — picking the lighter
      // one is often a better answer than dropping the school.
      const alts = (s.intakes || []).filter((iw) => iw.cadence && iw.cadence.days != null);
      if (alts.length > 1) {
        lines.push(`    start windows differ: ${alts
          .map((iw) => `${iw.label} = ${travelText(iw.cadence)}${iw.on ? '' : ' (switched off)'}`)
          .join(' vs ')}`);
      }
    });
  const acts = (data.actions || []).filter((a) => !a.done);
  if (acts.length) {
    lines.push('', 'OUTSTANDING ACTIONS:');
    acts.forEach((a) => lines.push(`- ${a.label}${a.due ? ` (due ${a.due})` : ''}`));
  }
  const r = fxRate();
  if (r) lines.push('', `Costs are in USD; their exchange rate is ₦${r} per $1.`);
  return lines.join('\n');
}

const AI_SYSTEM =
  'You are a concise admissions adviser inside an EMBA application tracker. ' +
  'Answer in British English. Prefer short paragraphs and bullet lists over long prose. ' +
  'When the tracker data below is relevant, use it and refer to schools by name. ' +
  'If the data does not contain what is needed, say so plainly rather than guessing at ' +
  'a deadline or a fee — a wrong date here costs the user an application.';

/* ---- One call to one model ----
   Resolves with the text, or throws an object saying whether the problem
   was this model (fall through to the next) or the key/request itself
   (stop — trying five more models with a dead key just wastes time). */
async function callModel(modelId, key, prompt, history, withContext) {
  const contents = history.map((m) => ({
    role: m.role === 'ai' ? 'model' : 'user',
    parts: [{ text: m.text }],
  }));
  contents.push({ role: 'user', parts: [{ text: prompt }] });

  const sys = withContext ? AI_SYSTEM + '\n\n' + aiContext() : AI_SYSTEM;

  let res;
  try {
    res = await fetch(AI_ENDPOINT + encodeURIComponent(modelId) + ':generateContent', {
      method: 'POST',
      // The key goes in a header, not the query string: a URL ends up in
      // logs, history and referrers, and this one is billable.
      headers: { 'Content-Type': 'application/json', 'x-goog-api-key': key },
      body: JSON.stringify({
        contents,
        systemInstruction: { parts: [{ text: sys }] },
        generationConfig: { temperature: 0.6, maxOutputTokens: 2048 },
      }),
    });
  } catch (e) {
    // No response at all — offline or blocked. Not this model's fault, so
    // there is nothing to be gained by trying the next five.
    throw { fatal: true, msg: 'Could not reach Google. Check the connection and try again.' };
  }

  let body = null;
  try { body = await res.json(); } catch (e) {}

  if (!res.ok) {
    const err = body?.error || {};
    const status = err.status || '';
    const msg = err.message || `HTTP ${res.status}`;
    // A bad key fails identically on every model.
    if (res.status === 401 || /API_KEY|API key not valid|UNAUTHENTICATED/i.test(status + msg)) {
      throw { fatal: true, msg: 'That API key was rejected. Check it in Settings.' };
    }
    if (status === 'PERMISSION_DENIED' && !/model/i.test(msg)) {
      throw { fatal: true, msg: 'The key is valid but the Generative Language API is not enabled for its project.' };
    }
    // Everything else — 404 unknown model, quota, overload — is this model's
    // problem. Fall through and let the next one try.
    throw { fatal: false, msg: `${modelId}: ${msg}` };
  }

  const blocked = body?.promptFeedback?.blockReason;
  if (blocked) throw { fatal: true, msg: `Gemini declined to answer that (${blocked}).` };

  const cand = body?.candidates?.[0];
  const text = (cand?.content?.parts || []).map((p) => p.text || '').join('').trim();
  if (!text) {
    // An empty answer with a stop reason is a real refusal; an empty answer
    // with no reason is the model misbehaving, which the next one may not.
    const why = cand?.finishReason;
    if (why && why !== 'STOP') throw { fatal: true, msg: `Gemini stopped early (${why}).` };
    throw { fatal: false, msg: `${modelId}: empty response` };
  }
  return text;
}

/* Walk the chain until something answers. */
async function askGemini(prompt, history, withContext) {
  const k = activeKey();
  if (!k) throw { fatal: true, msg: 'No API key selected. Add one under Settings → Ask Gemini.' };

  const skipped = [];
  for (const m of AI_MODELS) {
    try {
      const text = await callModel(m.id, k.key, prompt, history, withContext);
      return { text, model: m.id, skipped };
    } catch (e) {
      if (e.fatal) throw e;
      skipped.push({ id: m.id, msg: e.msg });
      console.warn('Gemini fallback:', e.msg);
    }
  }
  throw { fatal: true, msg: 'Every model in the fallback chain refused: ' + skipped.map((s) => s.msg).join(' | ') };
}

/* ---- Rendering ----
   Gemini answers in markdown. This covers the parts it actually uses —
   headings, bullets, bold, inline code — and escapes everything first, so
   a reply can never inject markup into the page. */
function mdToHtml(src) {
  const inline = (t) => esc(t)
    .replace(/`([^`]+)`/g, '<code>$1</code>')
    .replace(/\*\*([^*]+)\*\*/g, '<b>$1</b>')
    .replace(/(^|[\s(])\*([^*\n]+)\*/g, '$1<i>$2</i>');

  const out = [];
  let list = null;
  const closeList = () => { if (list) { out.push(`</${list}>`); list = null; } };

  String(src).split('\n').forEach((raw) => {
    const line = raw.replace(/\s+$/, '');
    const bullet = line.match(/^\s*[-*•]\s+(.*)$/);
    const numbered = line.match(/^\s*\d+[.)]\s+(.*)$/);
    const heading = line.match(/^#{1,6}\s+(.*)$/);
    if (bullet || numbered) {
      const want = bullet ? 'ul' : 'ol';
      if (list !== want) { closeList(); out.push(`<${want}>`); list = want; }
      out.push(`<li>${inline((bullet || numbered)[1])}</li>`);
    } else if (heading) {
      closeList(); out.push(`<h4>${inline(heading[1])}</h4>`);
    } else if (!line.trim()) {
      closeList();
    } else {
      closeList(); out.push(`<p>${inline(line)}</p>`);
    }
  });
  closeList();
  return out.join('');
}

function renderChat() {
  const box = $('#aimsgs');
  if (!box) return;
  const key = activeKey();

  if (!aiChat.length && !aiBusy) {
    const n = activeSchools().length;
    box.innerHTML = key
      ? `<div style="font-size:14px;color:var(--muted);line-height:1.6">
           It can see all ${n} schools, every deadline, your ticks and your funding
           numbers. Ask it anything, or start here.</div>
         <div class="aisugs">${AI_SUGGESTIONS.map(([tag, q], i) => `
           <button class="aisug" onclick="__aiSug(${i})">
             <span class="tag">${tag}</span><span class="q">${esc(q)}</span>
           </button>`).join('')}</div>`
      : `<div class="aiempty"><b>No API key yet</b>
           Add a Gemini API key under <b>More → Ask Gemini</b>, then come back.
           Keys are free to create at aistudio.google.com.</div>`;
    return;
  }

  box.innerHTML = aiChat.map((m) => {
    if (m.role === 'me') return `<div class="aimsg me">${esc(m.text)}</div>`;
    // Every answer states the model that produced it. If the default was
    // skipped, say which one and why — an answer from a weaker model is
    // still an answer, but you should know that is what you are reading.
    const by = m.error ? '' : `
      <div class="aiby">Answered by <b>${esc(modelLabel(m.model))}</b>
        <span class="mono">${esc(m.model)}</span>${
        (m.skipped && m.skipped.length)
          ? ` · <span class="fell">fell back from ${esc(modelLabel(m.skipped[0].id))}</span>`
          : ''}</div>`;
    return `<div class="aimsg ai${m.error ? ' err' : ''}">
      <div class="aibody">${m.error ? esc(m.text) : mdToHtml(m.text)}</div>${by}</div>`;
  }).join('');

  if (aiBusy) {
    box.insertAdjacentHTML('beforeend', `
      <div class="aimsg ai"><div class="aibody">
        <span class="aidots"><i></i><i></i><i></i></span></div></div>`);
  }
  // The thread scrolls with the page now, not inside its own box.
  if (aiChat.length) window.scrollTo({ top: document.body.scrollHeight, behavior: 'smooth' });
}

function aiSyncModelLine() {
  const el = $('#aimodel');
  if (!el) return;
  const k = activeKey();
  const last = [...aiChat].reverse().find((m) => m.role === 'ai' && m.model);
  el.textContent = !k ? 'no API key selected'
    : last ? `${modelLabel(last.model)} · key ${k.label}`
    : `${modelLabel(AI_MODELS[0].id)} · key ${k.label}`;
}

/* The composer grows with what you type instead of scrolling inside a
   fixed box. Reset to auto first, or scrollHeight only ever climbs. */
function aiGrow() {
  const el = $('#aiin');
  if (!el) return;
  el.style.height = 'auto';
  el.style.height = Math.min(el.scrollHeight, 168) + 'px';
}

async function aiSend() {
  const el = $('#aiin');
  const q = el.value.trim();
  if (!q || aiBusy) return;

  if (!activeKey()) { toast('Add a Gemini API key under Settings first'); return; }

  // The turns already exchanged, so follow-ups keep their thread. Errors are
  // left out — a failure notice is not something the model should reply to.
  const history = aiChat.filter((m) => !m.error).slice(-12)
    .map((m) => ({ role: m.role, text: m.text }));

  aiChat.push({ role: 'me', text: q, ts: Date.now() });
  el.value = ''; aiGrow();
  aiBusy = true;
  $('#aisend').disabled = true;
  renderChat();

  try {
    const { text, model, skipped } = await askGemini(q, history, !!(data.ai && data.ai.useContext));
    aiChat.push({ role: 'ai', text, model, skipped, ts: Date.now() });
  } catch (e) {
    aiChat.push({ role: 'ai', text: e.msg || 'Something went wrong.', error: true, ts: Date.now() });
  } finally {
    aiBusy = false;
    $('#aisend').disabled = false;
    saveChat();
    renderChat();
    aiSyncModelLine();
  }
}

$('#aisend').addEventListener('click', aiSend);
$('#aiclear').addEventListener('click', () => {
  if (!aiChat.length) return;
  if (!confirm('Clear this conversation?')) return;
  aiChat = []; saveChat(); renderChat(); aiSyncModelLine();
});
$('#aictx').addEventListener('change', (e) => {
  data.ai.useContext = e.target.checked;
  save();
});
$('#aiin').addEventListener('input', aiGrow);
$('#aiin').addEventListener('keydown', (e) => {
  // Enter inserts a newline — this is a phone-first app and Enter is how you
  // get a second line. Ctrl/Cmd+Enter sends, as does the button.
  if (e.key === 'Enter' && (e.metaKey || e.ctrlKey)) { e.preventDefault(); aiSend(); }
});
/* Openers. Tapping one sends it straight away — the point of a suggestion
   is that you did not have to think of the question. */
const AI_SUGGESTIONS = [
  ['TRIAGE',    'What should I do first this week, and why?'],
  ['MONEY',     'Which three schools can I actually afford?'],
  ['RISK',      'Which deadlines am I most likely to miss?'],
  ['SHORTLIST', 'Given my QS ranks and costs, which five should I keep?'],
];
window.__aiSug = (i) => {
  const q = AI_SUGGESTIONS[i];
  if (!q) return;
  $('#aiin').value = q[1];
  aiGrow();
  aiSend();
};

/* Kept as a name because render() calls it. The composer now says why it
   cannot answer, which is a better place for it than a dot on a button. */
function refreshFab() {
  const el = $('#aiin');
  if (el) el.placeholder = activeKey()
    ? 'Ask about your applications…'
    : 'Add a Gemini API key under More first';
}

/* ---- Settings: stored keys ---- */
window.__aiAddKey = () => {
  const labelEl = $('#kLabel'), valEl = $('#kVal');
  const key = valEl.value.trim();
  if (!key) { toast('Paste a key first'); return; }
  if (aiKeys().some((k) => k.key === key)) { toast('That key is already stored'); return; }
  const label = labelEl.value.trim() || `Key ${aiKeys().length + 1}`;
  const id = 'k' + Date.now().toString(36);
  data.ai.keys.push({ id, label, key, addedAt: Date.now() });
  // First key in becomes the active one — nobody adds a key meaning not to
  // use it, and one more tap to switch it on is friction for nothing.
  if (!data.ai.activeId) data.ai.activeId = id;
  save(); renderSettings(); refreshFab(); aiSyncModelLine();
  toast(`Key “${label}” stored and syncing`);
};

window.__aiUseKey = (id) => {
  data.ai.activeId = id;
  save(); renderSettings(); refreshFab(); aiSyncModelLine();
  toast(`Now using “${aiKeys().find((k) => k.id === id)?.label || id}”`);
};

window.__aiDelKey = (id) => {
  const k = aiKeys().find((x) => x.id === id);
  if (!confirm(`Remove the key “${k?.label || id}”? It goes from every synced device.`)) return;
  data.ai.keys = aiKeys().filter((x) => x.id !== id);
  if (data.ai.activeId === id) data.ai.activeId = data.ai.keys[0]?.id || null;
  save(); renderSettings(); refreshFab(); aiSyncModelLine();
  toast('Key removed');
};

/* Asks the key which models it can actually reach. The fallback chain is a
   list of names, and names change — this is how you find out what is really
   there rather than discovering it one failed request at a time. */
window.__aiCheckModels = async () => {
  const box = $('#kModels');
  const k = activeKey();
  if (!k) { toast('Select a key first'); return; }
  box.innerHTML = '<div class="setnote">Asking Google what this key can reach…</div>';
  try {
    const res = await fetch('https://generativelanguage.googleapis.com/v1beta/models',
      { headers: { 'x-goog-api-key': k.key } });
    const body = await res.json();
    if (!res.ok) throw new Error(body?.error?.message || `HTTP ${res.status}`);
    const avail = new Set((body.models || [])
      .filter((m) => (m.supportedGenerationMethods || []).includes('generateContent'))
      .map((m) => String(m.name).replace(/^models\//, '')));
    box.innerHTML = `<div class="setnote">${AI_MODELS.map((m) =>
      `${avail.has(m.id) ? '✓' : '✗'} ${esc(m.label)} <span class="mono">${esc(m.id)}</span>`
    ).join('<br>')}<br><br>${avail.size} model${avail.size === 1 ? '' : 's'} reachable in total.
      A ✗ is skipped automatically — the first ✓ down the list is what answers.</div>`;
  } catch (e) {
    box.innerHTML = `<div class="setnote">Could not check: ${esc(e.message || e)}</div>`;
  }
};

/* ---------------- Render ---------------- */
function render() {
  if (!data) return;
  renderDash();
  renderSchools();
  renderPlan();
  renderMoney();
  renderSettings();
  refreshFab();
}

/* ---------------- Daily snapshots ----------------
   Once per day, after sync connects, a copy of the whole document is
   written to a per-weekday slot (see sync.js). Rolling back is a normal
   save: the restored data becomes the live document and syncs everywhere. */
function maybeSnapshot() {
  if (!data || !window.EmbaSync) return;
  const stamp = todayISO();
  if (localStorage.getItem('lastSnap') === stamp) return;
  window.EmbaSync.snapshot(data).then((ok) => {
    if (ok) localStorage.setItem('lastSnap', stamp);
  });
}

const DAY_NAMES = { mon:'Monday', tue:'Tuesday', wed:'Wednesday', thu:'Thursday', fri:'Friday', sat:'Saturday', sun:'Sunday' };

window.__snapList = async () => {
  const box = $('#snapList');
  if (!window.EmbaSync || !window.EmbaSync.available()) { toast('Sync is not set up on this device'); return; }
  box.innerHTML = '<div class="setnote">Looking for snapshots…</div>';
  const snaps = await window.EmbaSync.listSnapshots();
  if (!snaps.length) {
    box.innerHTML = '<div class="setnote">No snapshots yet — the first one is written the next time the app opens with sync connected.</div>';
    return;
  }
  box.innerHTML = snaps.map(({ day, updatedAt }) => `
    <div class="setrow">
      <div class="setlbl">
        <b>${DAY_NAMES[day] || day}</b>
        <span class="logosrc">${updatedAt ? new Date(updatedAt).toLocaleString('en-GB', { day:'numeric', month:'short', hour:'2-digit', minute:'2-digit' }) : 'unknown time'}</span>
      </div>
      <button class="setbtn" onclick="__snapRestore('${day}')">Restore</button>
    </div>`).join('');
};

window.__snapRestore = async (day) => {
  if (!confirm(`Replace everything with the ${DAY_NAMES[day] || day} snapshot? This syncs to every device.`)) return;
  const payload = await window.EmbaSync.getSnapshot(day);
  if (!payload || !Array.isArray(payload.schools)) { toast('Could not read that snapshot'); return; }
  data = payload;
  migrate(data);
  save();
  render();
  toast(`Rolled back to ${DAY_NAMES[day] || day}'s snapshot`);
};

/* ---------------- Device push ----------------
   The service worker's push handler has been sitting dormant; this is the
   client half that brings it to life. The sending half is a scheduled
   GitHub Action (scripts/send-push.mjs) — free, no Firebase paid plan.
   Until that Action is set up, enabling here stores the subscription and
   nothing arrives; PUSH-SETUP.md walks through the one-time setup. */
const VAPID_PUBLIC_KEY = 'BPL6724MYxNUc0xe53WYxWRTTW-9VJoixE3RU1qdxs9X2Bmss83Nd5oo1rcqsmst3ncC5Z9JZF2lq6_klk5A1E0';

function urlB64ToUint8Array(s) {
  const pad = '='.repeat((4 - (s.length % 4)) % 4);
  const raw = atob((s + pad).replace(/-/g, '+').replace(/_/g, '/'));
  return Uint8Array.from(raw, (c) => c.charCodeAt(0));
}

window.__enablePush = async () => {
  if (!('serviceWorker' in navigator) || !('PushManager' in window)) {
    toast('This browser does not support push'); return;
  }
  const perm = await Notification.requestPermission();
  if (perm !== 'granted') { toast('Notifications are blocked in your browser settings'); return; }
  try {
    const reg = await navigator.serviceWorker.ready;
    const sub = await reg.pushManager.subscribe({
      userVisibleOnly: true,
      applicationServerKey: urlB64ToUint8Array(VAPID_PUBLIC_KEY),
    });
    const ok = window.EmbaSync && await window.EmbaSync.savePushSub(sub.toJSON());
    toast(ok
      ? 'Device registered — daily reminders will arrive once the GitHub Action is live'
      : 'Subscribed on this device, but saving it for the sender failed');
  } catch (e) {
    console.error('Push subscribe failed', e);
    toast('Could not subscribe this device for push');
  }
};

/* ---------------- Reminders ----------------
   Browser notifications fire only while this page is open in a tab.
   For push when the app is closed, see the Device notifications row in
   Settings and PUSH-SETUP.md.
-------------------------------------------- */
$('#notify').addEventListener('click', async () => {
  if (!('Notification' in window)) { toast('This browser does not support notifications'); return; }
  const perm = await Notification.requestPermission();
  if (perm !== 'granted') { toast('Notifications are blocked in your browser settings'); return; }
  toast('Reminders on while this tab is open');
  checkDue(true);
});

function checkDue(force = false) {
  if (!data || Notification.permission !== 'granted') return;
  const stamp = todayISO();
  if (!force && localStorage.getItem('lastNotify') === stamp) return;

  const soon = [];
  activeSchools().filter(s => !isClosed(s)).forEach(s => (s.tasks || []).forEach(t => {
    const n = daysTo(t.due);
    if (!t.done && n !== null && n <= 7) soon.push(`${s.name}: ${t.label}`);
  }));
  (data.actions || []).forEach(t => {
    const n = daysTo(t.due);
    if (!t.done && n !== null && n <= 7) soon.push(t.label);
  });

  if (soon.length) {
    new Notification(`${soon.length} EMBA task${soon.length > 1 ? 's' : ''} due within 7 days`, {
      body: soon.slice(0, 3).join('\n') + (soon.length > 3 ? `\n…and ${soon.length - 3} more` : ''),
      tag: 'emba-due'
    });
    localStorage.setItem('lastNotify', stamp);
  }
}
setInterval(() => checkDue(false), 60 * 60 * 1000);
document.addEventListener('visibilitychange', () => { if (!document.hidden) checkDue(false); });

/* ---------------- Go ---------------- */
start();

/* ---------------- Service worker ----------------
   Registers the offline shell cache. Runs only over http(s),
   so it silently no-ops on file:// when opened directly.
-------------------------------------------------- */
if ('serviceWorker' in navigator && location.protocol.startsWith('http')) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('sw.js').catch((e) => {
      console.warn('Service worker registration failed:', e);
    });
  });
}
</script>
